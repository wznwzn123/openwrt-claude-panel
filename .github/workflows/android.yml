# 安卓 App 打包
# - 单独运行（Actions → 构建安卓 App → Run workflow）：打一个测试包，放在这次运行的「Artifacts」里下载
# - 发布新版本时会自动调用：打正式包（用签名密钥），传到这个版本的 Release 里，文件名 router-panel.apk
# 正式签名需要仓库密钥 ANDROID_SIGNING_PASS（解开 android/signing/router-panel.jks.enc 的密码）
name: 构建安卓 App
on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（例如 1.2.0）
        required: true
        default: 0.0.1
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release:
        required: false
        type: boolean
        default: false
    secrets:
      ANDROID_SIGNING_PASS:
        required: false
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.7'
      - name: 版本号
        id: v
        env:
          VERSION: ${{ inputs.version }}
        run: |
          V="$VERSION"; V="${V#v}"
          IFS=. read -r A B C <<< "$V"
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${A:-0} * 10000 + ${B:-0} * 100 + ${C:-0} ))" >> "$GITHUB_OUTPUT"
      - name: 解开签名密钥
        env:
          PASS: ${{ secrets.ANDROID_SIGNING_PASS }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -n "$PASS" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/signing/router-panel.jks.enc -out "$RUNNER_TEMP/release.jks" -pass env:PASS
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASS=$PASS" >> "$GITHUB_ENV"
            echo "::notice::使用正式签名"
          else
            if [ "$RELEASE" = "true" ]; then echo "::error::发布正式版需要先设置仓库密钥 ANDROID_SIGNING_PASS"; exit 1; fi
            echo "::warning::没有设置 ANDROID_SIGNING_PASS，打的是测试包（调试签名），不能拿去发布"
          fi
      - name: 打包
        env:
          HUB_URL: ${{ vars.HUB_URL }}
        run: |
          gradle -p android --no-daemon assembleRelease \
            -PVERSION_NAME="${{ steps.v.outputs.name }}" -PVERSION_CODE="${{ steps.v.outputs.code }}" -PHUB_URL="$HUB_URL"
          cp android/app/build/outputs/apk/release/app-release.apk router-panel.apk
          ls -la router-panel.apk
          rm -f "$RUNNER_TEMP/release.jks"
      - name: 签名指纹（正式签名应为 CB:CC:2E:F4…98:FB）
        run: |
          AS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          FP=$("$AS" verify --print-certs router-panel.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "::notice::签名 SHA-256：$FP"
          if [ -n "${{ secrets.ANDROID_SIGNING_PASS }}" ] && [ "$FP" != "cbcc2ef432b9a6938757f87955a9d81a6c7d8ed7587d71397147d07695a298fb" ]; then echo "::error::签名不是正式密钥"; exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: router-panel-${{ steps.v.outputs.name }}
          path: router-panel.apk
      - name: 传到 Release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "$VERSION" router-panel.apk --clobber
