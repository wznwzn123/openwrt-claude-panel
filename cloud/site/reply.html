<!doctype html>
<html lang="zh-CN" data-type="software" data-radius="soft" data-buttons="pill" data-ground="sage" data-motion>
<head>
<meta charset="utf-8">
<title>处理进度 · 路由器面板</title>
<meta name="robots" content="noindex">
<!--KIT_HEAD-->
<style>
/* 处理进度页：上面状态，中间三段进度，下面完整记录 */
.r-body { padding-top: clamp(28px, 4vw, 48px); }
.r-col { max-width: 760px; display: grid; gap: 16px; align-items: start; }
@media (min-width: 1024px) {
  .r-col { max-width: none; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); column-gap: clamp(24px, 3vw, 40px); grid-auto-flow: row dense; }
  .r-col > #box, .r-col > #ask, .r-col > #log { grid-column: 1; }
  .r-col > #more, .r-col > #tip, .r-col > .r-links { grid-column: 2; }
  .r-col > #more { grid-row: 1; }
  .r-col:has(> #more[hidden]) { grid-template-columns: minmax(0, 760px); }
  .r-col:has(> #more[hidden]) > .r-links { grid-column: 1; }
}
#evs:has(> .ev:only-child)::before { display: none; }
.st b { word-break: keep-all; }
.rcard { padding: clamp(20px, 3vw, 30px); border-radius: 22px; background: var(--p-surface); border: 1px solid var(--hair); }
.rcard .msg { margin: 0; font-size: 16px; line-height: 1.7; color: color-mix(in oklab, var(--ink) 82%, var(--bg)); }
.rcard.loading .msg::after { content: ""; display: inline-block; width: 14px; height: 14px; margin-left: 10px; vertical-align: -2px; border-radius: 50%; border: 2px solid var(--hair); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.rcard h2 { margin: 0 0 6px; font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
.rcard .hint { margin: 0; font-size: 14.5px; line-height: 1.7; color: var(--muted); }
.st { display: flex; align-items: center; gap: 16px; }
.st i { flex: none; width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; font-style: normal; font-size: 26px; font-weight: 700; color: #06140c; position: relative; }
.st i::after { content: ""; position: absolute; inset: -6px; border-radius: 22px; border: 2px solid currentColor; opacity: 0; animation: ring 2.4s ease-out infinite; }
@keyframes ring { 0% { opacity: .55; transform: scale(.9); } 80%, 100% { opacity: 0; transform: scale(1.25); } }
.st b { display: block; font-size: clamp(20px, 2.4vw, 26px); line-height: 1.3; letter-spacing: -.01em; }
.st span { display: block; margin-top: 4px; color: var(--muted); font-size: 14.5px; }
.st-ok .st i { background: linear-gradient(135deg, var(--ok), #22c55e); color: color-mix(in oklab, var(--ok) 14%, transparent); box-shadow: 0 0 40px -6px color-mix(in oklab, var(--ok) 70%, transparent); }
.st-ok .st i::after { color: var(--ok); }
.st-wait .st i { background: linear-gradient(135deg, var(--warn), var(--warn)); color: #3b2300; box-shadow: 0 0 40px -6px color-mix(in oklab, var(--warn) 60%, transparent); }
.st-wait .st i::after { color: var(--warn); }
.st-bad .st i { background: linear-gradient(135deg, var(--danger), var(--danger)); color: color-mix(in oklab, var(--danger) 14%, transparent); box-shadow: 0 0 40px -6px color-mix(in oklab, var(--danger) 60%, transparent); }
.st-bad .st i::after { color: var(--danger); }
.st-ok { border-color: color-mix(in oklab, var(--accent) 35%, transparent); background: radial-gradient(90% 120% at 0% 0%, color-mix(in oklab, var(--accent) 10%, transparent), transparent 60%), var(--p-surface); }
/* 三段进度：线从左往右长出来 */
.bar { margin-top: 22px; padding: 18px 8px 4px; border-top: 1px solid var(--hair); }
.fsteps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.fsteps > div { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; }
.fsteps > div + div::before { content: ""; position: absolute; top: 14px; right: calc(50% + 20px); width: calc(100% - 40px); height: 3px; border-radius: 3px; background: var(--hair); }
.fsteps > div + div::after { content: ""; position: absolute; top: 14px; right: calc(50% + 20px); width: calc(100% - 40px); height: 3px; border-radius: 3px; background: var(--accent); transform-origin: 0 50%; transform: scaleX(0); transition: transform .7s cubic-bezier(.22,1,.36,1); box-shadow: 0 0 10px color-mix(in oklab, var(--accent) 60%, transparent); }
.fsteps > div.bad::after { background: var(--danger); box-shadow: 0 0 10px color-mix(in oklab, var(--danger) 60%, transparent); }
.is-in .fsteps > div.on::after { transform: scaleX(1); }
.is-in .fsteps > div.on:nth-child(3)::after { transition-delay: .55s; }
.fsteps i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--font-mono); font-style: normal; background: color-mix(in oklab, var(--ink) 8%, transparent); color: var(--muted); transition: background .4s, color .4s, transform .4s; }
.fsteps .on i { background: var(--accent); color: color-mix(in oklab, var(--ok) 14%, transparent); }
.fsteps .bad i { background: var(--danger); color: color-mix(in oklab, var(--danger) 14%, transparent); }
.fsteps .cur i { box-shadow: 0 0 0 5px color-mix(in oklab, var(--accent) 22%, transparent); animation: pop .6s cubic-bezier(.22,1.6,.36,1) both; }
.fsteps .bad.cur i { box-shadow: 0 0 0 5px color-mix(in oklab, var(--danger) 22%, transparent); }
@keyframes pop { from { transform: scale(.4); } }
.fsteps b { display: block; margin-top: 9px; font-size: 13.5px; font-weight: 600; line-height: 1.35; word-break: keep-all; }
.fsteps .off b { color: var(--muted); font-weight: 500; }
.fsteps .bad b { color: var(--danger); }
/* 完整记录：一条竖线串起来 */
#evs { position: relative; margin-top: 14px; }
#evs::before { content: ""; position: absolute; left: 7px; top: 10px; bottom: 10px; width: 2px; background: linear-gradient(var(--accent), var(--hair)); border-radius: 2px; }
.ev { position: relative; padding: 0 0 22px 32px; animation: evin .5s cubic-bezier(.22,1,.36,1) both; }
.ev:nth-child(2) { animation-delay: .08s; } .ev:nth-child(3) { animation-delay: .16s; } .ev:nth-child(n+4) { animation-delay: .24s; }
@keyframes evin { from { opacity: 0; transform: translateY(10px); } }
.ev:last-child { padding-bottom: 0; }
.ev::before { content: ""; position: absolute; left: 1px; top: 5px; width: 14px; height: 14px; border-radius: 50%; background: var(--p-surface); border: 2px solid var(--muted); box-sizing: border-box; }
.ev.fixed::before { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 12px var(--accent); }
.ev.nofix::before { border-color: var(--danger); background: var(--danger); }
.ev.note::before, .ev.ack::before, .ev.open::before { border-color: var(--accent); }
.ev b { font-size: 15.5px; font-weight: 600; }
.ev time { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.ev p { margin: 10px 0 0; padding: 14px 16px; border-radius: 14px; background: color-mix(in oklab, var(--ink) 5%, transparent); border: 1px solid var(--hair); font-size: 15.5px; line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
.kv { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; font-size: 15px; border-bottom: 1px solid var(--hair); }
.kv:last-child { border-bottom: 0; }
.kv > span:first-child { color: var(--muted); }
#code { font-family: var(--font-mono); letter-spacing: .08em; font-size: 16px; }
.cp { min-height: 36px; padding: 0 14px; font-size: 14px; }
.q { display: flex; gap: 10px; margin-top: 18px; }
.q .input { flex: 1; min-width: 0; text-transform: uppercase; letter-spacing: .14em; font-size: 18px; font-family: var(--font-mono); }
.q .input::placeholder { text-transform: none; letter-spacing: 0; font-family: var(--font-text); font-size: 16px; }
.q .btn { flex: none; min-height: 48px; }
#tip { margin: 4px 0 0; font-size: 14.5px; line-height: 1.7; color: var(--muted); }
.r-links { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 8px; font-size: 14.5px; }
.r-links a { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .st i::after, .ev, .fsteps .cur i { animation: none; } .fsteps > div + div::after { transition: none; } }
</style>
</head>
<body>
<!--KIT_NAV-->
<main id="main">
  <div class="pg-hero">
    <div class="pg-fx" data-fx="grid-pulse" data-fx-seed="31" aria-hidden="true"></div>
    <div class="wrap" data-moment="lines-rise" data-moment-opts='{"heading":"h1","follow":".pg-sub"}'>
      <h1>处理进度</h1>
      <p class="pg-sub">你上报的问题，开发者处理到哪一步了、说了什么，都在这里。不用登录，有编号就能查。</p>
    </div>
  </div>
  <div class="r-body">
    <div class="wrap">
      <div class="r-col">
        <div class="rcard loading" id="box"><p class="msg">正在查……</p></div>
        <form class="rcard fxc" id="ask" hidden autocomplete="off">
          <h2>输入编号查进度</h2>
          <p class="hint">编号是 8 位字母和数字，上报成功时会显示。终端安装失败上报的，在路由器上运行 <code style="white-space:nowrap">cat /etc/cmcp-report</code> 也能看到。</p>
          <div class="q"><input class="input" id="qc" maxlength="20" placeholder="比如 K7F2Q9AB" autocapitalize="characters" spellcheck="false" inputmode="latin" aria-label="受理编号"><button class="btn btn--primary" type="submit">查询</button></div>
          <p class="err" id="qe" hidden></p>
        </form>
        <div class="rcard lg" id="log" hidden><h2>完整记录</h2><div id="evs"></div></div>
        <div class="rcard" id="more" hidden>
          <div class="kv"><span>编号</span><span style="display:flex;align-items:center;gap:10px"><b id="code"></b><button class="btn btn--secondary cp" id="cp" type="button">复制</button></span></div>
          <div class="kv"><span>类型</span><b id="kind"></b></div>
          <div class="kv"><span>上报时间</span><b id="at"></b></div>
        </div>
        <p id="tip" hidden></p>
        <div class="r-links"><a href="/r">查别的编号</a><a href="/security#report">报告新问题</a><a href="/app">到账号页看我的全部反馈</a></div>
      </div>
    </div>
  </div>
</main>
<!--KIT_FOOT-->
<!--KIT_JS-->
<script>
const $ = (id) => document.getElementById(id);
const esc = (x) => String(x ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const when = (t) => new Date(t).toLocaleString('zh-CN', { hour12: false, month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
// 进度条：反馈成功 → 开发人员已收到 → 已修复（没法修的，第三段变成「无法修复」）
const steps = (stage, nofix) => `<div class="fsteps" data-stage="${stage}">${['反馈成功', '开发人员已收到', '已修复'].map((x, i) => { const on = i < stage, bad = on && i === 2 && nofix;
	return `<div class="${on ? (bad ? 'on bad' : 'on') : 'off'}${i === stage - 1 ? ' cur' : ''}"><i>${bad ? '✕' : on ? '✓' : i + 1}</i><b>${bad ? '无法修复' : x}</b></div>`; }).join('')}</div>`;
const code = (location.pathname.split('/')[2] || '').toUpperCase();
// 输入编号：0、1、O、L 这几个容易看错的字不会出现在编号里，输错了就提示
$('ask').onsubmit = (e) => {
	e.preventDefault(); const v = $('qc').value.trim().toUpperCase().replace(/\s+/g, '');
	if (!/^[A-Z2-9]{8}$/.test(v) || /[01OL]/.test(v)) { $('qe').hidden = false; $('qe').textContent = /[01OL]/.test(v) ? '编号里没有 0、1、O、L 这几个字，看看是不是认错了' : '编号是 8 位字母和数字'; return; }
	location.href = '/r/' + v;
};
const ask = (msg) => { $('box').hidden = !msg; if (msg) { $('box').className = 'rcard st-bad'; $('box').innerHTML = `<p class="msg">${esc(msg)}</p>`; } $('ask').hidden = false; };
if (!/^[A-Z2-9]{8}$/.test(code)) ask('');
else fetch('/api/fb/' + encodeURIComponent(code)).then((r) => r.json()).then((d) => {
	if (!d.ok) { ask(d.error || '没查到'); $('qc').value = code; return; }
	const state = d.state || (d.done ? 'fixed' : 'open'), stage = d.stage || (d.done ? 3 : 1);
	const head = state === 'fixed' ? ['ok', '✓', '已经修复了', '修复时间：' + when(d.doneAt)]
		: state === 'nofix' ? ['bad', '✕', '暂时没法修复', '原因写在下面的记录里']
		: stage >= 2 ? ['wait', '…', '开发人员已收到，正在处理', '有进展会更新在这里'] : ['wait', '…', '已经提交，等开发人员查看', '有进展会更新在这里'];
	$('box').className = 'rcard fxc st-' + head[0];
	// 进度条只显示三段；补充说明这些都写在下面的「完整记录」里
	$('box').innerHTML = `<div class="st"><i>${head[1]}</i><div><b>${head[2]}</b><span>${esc(head[3])}</span></div></div>
		<div class="bar">${steps(stage, state === 'nofix')}</div>`;
	requestAnimationFrame(() => requestAnimationFrame(() => $('box').classList.add('is-in')));
	// 完整记录：新的在前；最下面是「反馈成功」
	const NAME = { fixed: '已修复', nofix: '无法修复', open: '重新打开，继续处理', note: '补充说明' };
	const evs = (d.history || (d.reply ? [{ at: d.replyAt, st: state, note: d.reply }] : [])).map((x) => ({ ...x, n: NAME[x.st] || '更新' }));
	if (d.ackAt) evs.push({ at: d.ackAt, st: 'ack', n: '开发人员已收到' });
	evs.sort((a, b) => b.at - a.at); evs.push({ at: d.at, st: 'sent', n: '反馈成功' });
	$('evs').innerHTML = evs.map((x) => `<div class="ev ${x.st}"><b>${esc(x.n)}</b><time>${when(x.at)}</time>${x.note ? `<p>${esc(x.note)}</p>` : ''}</div>`).join('');
	$('log').hidden = false;
	$('code').textContent = d.code; $('kind').textContent = d.kind; $('at').textContent = when(d.at); $('more').hidden = false;
	if (d.kind === '安装失败') { $('tip').hidden = false; $('tip').textContent = state === 'nofix' ? '如果以后情况有变化（比如换了固件），可以重新运行安装命令再试，失败了再上报一次。' : d.done ? '处理好以后，在路由器上重新运行一次安装命令就行。重新运行时，终端里也会显示这里的回复。' : '重新运行安装命令时，终端最上面也会显示这里的处理结果。'; }
	$('cp').onclick = async () => {
		try { await navigator.clipboard.writeText(d.code); } catch (e) { const a = document.createElement('textarea'); a.value = d.code; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (x) {} a.remove(); }
		$('cp').textContent = '已复制 ✓'; setTimeout(() => { $('cp').textContent = '复制'; }, 1500);
	};
}).catch(() => { $('box').innerHTML = '<p class="msg">网络不太好，刷新一下再试。</p>'; });
</script>
</body>
</html>
