<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22.5' fill='%23101C40'/><path d='M41.91 24.45A29 29 0 1 0 75.55 58.09A24 24 0 0 1 41.91 24.45Z' fill='%23F4F1EA'/><path d='M62.6 21.4A17 17 0 0 1 78.6 37.4' stroke='%23FFB547' stroke-width='4' stroke-linecap='round' fill='none'/><circle cx='63' cy='37' r='7' fill='%23FFB547'/></svg>"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,viewport-fit=cover">
<title>托管服务管理</title><meta name="robots" content="noindex">
<style>/*COMMON_CSS*/
.pill{display:inline-block;padding:1px 9px;border-radius:99px;background:rgba(255,149,0,.16);color:var(--warn);font-weight:650}.pill:empty{display:none}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat .card{cursor:pointer}.stat .card.on{outline:2px solid var(--brand,#007aff)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}.chips .btn.on{background:var(--brand,#007aff);color:#fff}
.anote{display:block;font-size:12.5px;color:var(--brand,#007aff);margin-top:2px}
.lg{display:flex;gap:10px;padding:8px 0;border-bottom:.5px solid var(--line);font-size:13px;line-height:1.5}.lg:last-child{border-bottom:0}.lg time{flex:none;color:var(--muted);width:88px}.lg b{font-weight:650}.lg .by{display:inline-block;font-size:11px;padding:0 6px;border-radius:99px;background:rgba(127,127,127,.14);margin-right:4px}
@media(max-width:520px){#devs .item,#users .item{flex-direction:column;align-items:stretch;gap:8px}#devs .item .acts,#users .item .acts{justify-content:flex-start}.stat b{font-size:19px}.stat span{font-size:11.5px}.lg time{width:72px}}
.stat .card{text-align:center;padding:12px 6px}.stat b{display:block;font-size:22px}.stat span{font-size:12.5px;color:var(--muted)}
.sech{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:22px 4px 10px}.sech h2{font-size:19px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:.5px solid var(--line)}
.item:last-child{border-bottom:0}
.item .l{min-width:0}.item .l b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item .l span{font-size:12.5px;color:var(--muted)}
.item .acts{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.item .l .fsteps b{white-space:normal;overflow:visible}.fbacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fbbar{margin:10px 0 2px;padding:10px 6px 8px;border-radius:12px;background:var(--fill)}
code{font:600 15px ui-monospace,Menlo,monospace;letter-spacing:1px}
.g3{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3 .full{grid-column:1/-1}
.dlg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.dlg .card{width:min(460px,100%);margin:0 0 env(safe-area-inset-bottom);background:var(--bg);box-shadow:0 12px 40px rgba(0,0,0,.25)}.dlg h3{margin:0 0 4px;font-size:18px}
.dchips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 8px}.dchips .btn.on{background:var(--brand,#007aff);color:#fff}
.fbimgs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px}.fbimg{width:86px;height:86px;border-radius:12px;border:.5px solid var(--line);background:var(--fill);padding:0;overflow:hidden;display:grid;place-items:center;font-size:12px}.fbimg img{width:100%;height:100%;object-fit:cover;display:block}
.dprev{margin:10px 0 2px;font-size:14px;line-height:1.6}.dprev b{color:var(--brand,#007aff)}.dprev .bad{color:var(--danger,#ff3b30)}
.vtag{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:99px;background:rgba(52,199,89,.16);color:var(--ok);margin-right:2px}.vtag.old{background:rgba(255,59,48,.14);color:var(--danger)}.vtag.none{background:var(--fill);color:var(--muted);font-weight:600}
</style></head><body><div class="wrap">
<div class="top"><a class="logo" href="/"><i><svg viewBox="0 0 100 100" fill="none" aria-hidden="true"><path d="M41.91 24.45A29 29 0 1 0 75.55 58.09A24 24 0 0 1 41.91 24.45Z" fill="#F4F1EA"/><path d="M62.6 21.4A17 17 0 0 1 78.6 37.4" stroke="#FFB547" stroke-width="4" stroke-linecap="round" fill="none"/><circle cx="63" cy="37" r="7" fill="#FFB547"/></svg></i>托管服务管理</a><button class="btn sm hidden" id="outBtn">退出</button></div>
<section id="vKey" class="card hidden" style="max-width:420px;margin:8vh auto 0">
	<form id="fKey"><label class="f">管理员密钥（ADMIN_KEY）</label><input class="input" name="k" type="password" autocomplete="off" required>
	<div class="err" data-err></div><button class="btn primary" style="width:100%">进入</button></form>
	<p class="muted" style="font-size:12.5px;margin:12px 0 0">密钥只保存在这个浏览器标签页里，关掉就清除。</p>
</section>
<section id="vMain" class="hidden">
	<div class="stat" id="stats"></div>
	<p class="muted" id="vdist" style="font-size:13px;margin:8px 2px 0;line-height:1.7"></p>
	<div class="notice w hidden" id="dnsFull" style="margin:10px 0 0"></div>
	<div class="sech" style="display:flex;align-items:center;justify-content:space-between;gap:10px"><h2>续期申请 <span class="pill" id="apN" style="font-size:13px;vertical-align:middle"></span></h2><button class="btn sm" id="mailTest" type="button" title="有新申请时会发邮件提醒你；点这里发一封试试">发测试邮件</button></div>
	<div class="card"><div id="aps"></div></div>
	<div class="sech"><h2>问题反馈 <span class="pill" id="fbN" style="font-size:13px;vertical-align:middle"></span></h2></div>
	<div class="card"><div id="fbs"></div></div>
	<div class="sech"><h2>公告 <span class="pill" id="annN" style="font-size:13px;vertical-align:middle"></span></h2></div>
	<div class="card">
		<p class="muted" style="margin:0 0 6px;font-size:13px">发出去以后，所有人（托管版和自建版）打开面板的「通知」都能看到。选「重要」的，路由器还会推送到手机，打开面板时也会弹出来一次。</p>
		<form id="fAnn" class="g3">
			<div class="full"><label class="f">标题</label><input class="input" name="title" maxlength="80" required></div>
			<div class="full"><label class="f">内容（可以不填）</label><textarea class="input" name="body" rows="3" maxlength="2000" style="resize:vertical"></textarea></div>
			<div><label class="f">级别</label><select class="input" name="level"><option value="normal">普通</option><option value="important">重要（推送到手机）</option></select></div>
			<div><label class="f">显示几天（0 = 一直显示）</label><input class="input" name="days" type="number" min="0" max="365" value="0" required></div>
			<div class="full"><button class="btn primary" data-go>发布公告</button> <button class="btn hidden" type="button" data-cancel>不改了</button><span class="err" data-err></span></div>
		</form>
		<div id="anns" style="margin-top:8px"></div>
	</div>
	<div class="sech"><h2>邀请码</h2></div>
	<div class="card">
		<form id="fInv" class="g3">
			<div><label class="f">能开通几台</label><input class="input" name="max" type="number" min="1" max="1000" value="1" required></div>
			<div><label class="f">邀请码几天内能用（0 = 一直能用）</label><input class="input" name="days" type="number" min="0" max="3650" value="7" required></div>
			<div><label class="f">开通后试用几天（0 = 不限期）</label><input class="input" name="svc" type="number" min="0" max="3650" value="7" required></div>
			<div class="full"><label class="f">备注（给谁的）</label><input class="input" name="note" maxlength="60"></div>
			<div class="full"><button class="btn primary">生成邀请码</button><span class="err" data-err></span></div>
		</form>
		<div id="invs" style="margin-top:8px"></div>
	</div>
	<div class="sech"><h2>续期码</h2></div>
	<div class="card">
		<p class="muted" style="margin:0 0 6px;font-size:13px">试用到期前，用户找你要续期码，在官网账号页这台路由器下面点「续期」输入。一个码只能用一次。</p>
		<form id="fRen" class="g3">
			<div><label class="f">续几天</label><input class="input" name="days" type="number" min="1" max="3650" value="90" required></div>
			<div><label class="f">生成几个</label><input class="input" name="count" type="number" min="1" max="50" value="1" required></div>
			<div class="full"><label class="f">备注（给谁的）</label><input class="input" name="note" maxlength="60"></div>
			<div class="full"><button class="btn primary">生成续期码</button><span class="err" data-err></span></div>
		</form>
		<div id="rens" style="margin-top:8px"></div>
	</div>
	<div class="sech"><h2>路由器</h2><button class="btn sm" id="cleanBtn" title="90 天没上线的放进回收站（30 天内能恢复）">清理 90 天没上线的</button></div>
	<div class="card"><div class="chips" id="fchips"></div><input class="input" id="q" placeholder="搜索子域名、名称、型号、备注" style="margin-bottom:6px"><div id="devs"></div></div>
	<div class="sech"><h2>账号</h2><span class="pill" id="uN" style="font-size:13px"></span></div>
	<div class="card"><input class="input" id="uq" placeholder="搜索邮箱、路由器" style="margin-bottom:6px"><div id="users"></div></div>
	<div class="sech"><h2>操作记录</h2></div>
	<div class="card"><p class="muted" style="margin:0 0 4px;font-size:12.5px">谁在什么时候删了、停了、恢复了哪台路由器或账号，都记在这里（最近 500 条）。</p><div id="logs"></div></div>
</section>
<div class="toast hide" id="toast"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
let tt; function toast(t) { const e = $('toast'); e.textContent = t; e.classList.remove('hide'); clearTimeout(tt); tt = setTimeout(() => e.classList.add('hide'), 2600); }
let KEY = ''; try { KEY = sessionStorage.getItem('hubkey') || ''; } catch (e) {}
// 开了两步验证（5.0）：输一次验证码换 12 小时的通行证
let SESS = '', TFA = null; try { SESS = sessionStorage.getItem('hubsess') || ''; } catch (e) {}
const hdr = () => Object.assign({ authorization: 'Bearer ' + KEY, 'content-type': 'application/json' }, SESS ? { 'x-adm-sess': SESS } : {});
async function api(method, path, body, again) {
	const r = await fetch('/api/admin/' + path, { method, headers: hdr(), body: body ? JSON.stringify(body) : undefined });
	let j = {}; try { j = await r.json(); } catch (e) {}
	if (r.status === 401 && j.need2fa && !again) {
		// 好几个请求同时要验证码时只问一次
		if (!TFA) TFA = (async () => {
			const c = window.prompt('管理后台开了两步验证：输入手机验证码 App 里的 6 位数字');
			if (!c) return false;
			const l = await fetch('/api/admin/login', { method: 'POST', headers: hdr(), body: JSON.stringify({ code: c.trim() }) }); let lj = {}; try { lj = await l.json(); } catch (e) {}
			if (l.ok && lj.sess) { SESS = lj.sess; try { sessionStorage.setItem('hubsess', SESS); } catch (e) {} return true; }
			return false;
		})().finally(() => setTimeout(() => { TFA = null; }, 0));
		if (await TFA) return api(method, path, body, true);
	}
	if (r.status === 401) { logout(); throw new Error(j.need2fa ? '两步验证码不对' : '管理员密钥不对'); }
	if (!r.ok) throw new Error(j.error || '出错了（' + r.status + '）');
	return j;
}
const day = (t) => t ? new Date(t).toLocaleDateString('zh-CN') : '—';
const ago = (t) => { if (!t) return '—'; const s = (Date.now() - t) / 1000; return s < 3600 ? Math.max(1, Math.round(s / 60)) + ' 分钟前' : s < 86400 ? Math.round(s / 3600) + ' 小时前' : Math.round(s / 86400) + ' 天前'; };
function logout() { KEY = ''; SESS = ''; try { sessionStorage.removeItem('hubkey'); sessionStorage.removeItem('hubsess'); } catch (e) {} $('vKey').classList.remove('hidden'); $('vMain').classList.add('hidden'); $('outBtn').classList.add('hidden'); }
$('outBtn').onclick = logout;
$('mailTest').onclick = async () => {
	const b = $('mailTest'); b.disabled = true;
	try { const r = await api('POST', 'testmail'); toast('测试邮件已发到 ' + r.to + '，没收到的话看看垃圾箱'); }
	catch (x) { toast(x.message); }
	b.disabled = false;
};
$('fKey').onsubmit = async (e) => { e.preventDefault(); KEY = e.target.k.value.trim(); try { await load(); try { sessionStorage.setItem('hubkey', KEY); } catch (x) {} } catch (x) { e.target.querySelector('[data-err]').textContent = x.message; } };
let DEVS = [];
let TRASH_DAYS = 30;
function renderDevs() {
	const q = $('q').value.trim().toLowerCase();
	const hit = (d) => (!q || [d.sub, d.name, d.model, d.anote].join(' ').toLowerCase().includes(q)) && (FILTER === 'all' || FILTER === 'bin' || (FS[FILTER] && FS[FILTER].f(d)));
	const live = FILTER === 'bin' ? [] : DEVS.filter((d) => d.offWhy !== 'deleted' && hit(d)).sort((a, b) => (b.seen || 0) - (a.seen || 0));
	const bin = FILTER === 'all' || FILTER === 'bin' ? DEVS.filter((d) => d.offWhy === 'deleted' && hit(d)).sort((a, b) => (a.purgeAt || 0) - (b.purgeAt || 0)) : [];
	$('fchips').innerHTML = Object.entries(FS).map(([k, v]) => `<button class="btn sm ${FILTER === k ? 'on' : ''}" data-f="${k}">${v.n} ${DEVS.filter(v.f).length}</button>`).join('');
	document.querySelectorAll('#stats [data-f]').forEach((c) => c.classList.toggle('on', c.dataset.f === FILTER && FILTER !== 'all'));
	const status = (d) => d.state !== 'ok' ? '开通中' : d.off ? (d.offWhy === 'exp' ? '⏸ 已到期暂停' : '⛔ 已封禁') : '最后上线 ' + ago(d.seen);
	const prot = (d) => d.prot ? ' <span class="pill" style="background:rgba(52,199,89,.16);color:var(--ok)">🛡 受保护</span>' : '';
	$('devs').innerHTML = (live.length ? live.map((d) => `<div class="item" data-sub="${esc(d.sub)}"><div class="l"><b>${esc(d.name || d.sub)} <span>${esc(d.sub)}</span>${prot(d)}</b>
		<span>${verTag(d)} ${status(d)}${d.exp ? ' · 到期 ' + day(d.exp) : ' · 不限期'}${d.renewed ? ' · 续过期' : d.exp ? ' · 试用' : ''} · ${esc(d.model || '未知型号')} · ${day(d.created)} 开通 · ${(d.users || []).length} 个账号 · 邀请码 ${esc(d.invite || '')}</span>${d.anote ? `<span class="anote">📝 ${esc(d.anote)}</span>` : ''}</div>
		<div class="acts">${d.exp && d.state === 'ok' ? '<button class="btn sm primary" data-op="extend">加天数</button>' : ''}<button class="btn sm" data-op="note">备注</button>${d.off ? '<button class="btn sm" data-op="on">解封</button>' : '<button class="btn sm" data-op="off">封禁</button>'}${d.protect ? '<button class="btn sm" data-op="unprotect">取消保护</button>' : d.prot ? '' : '<button class="btn sm" data-op="protect">保护</button>'}${d.prot ? '' : '<button class="btn sm danger" data-op="delete">删除</button>'}</div></div>`).join('') : '<p class="muted" style="text-align:center">没有路由器</p>')
		+ (bin.length ? `<p class="muted" style="margin:16px 0 4px;font-size:13px">回收站（${bin.length} 台）：网址已停用，隧道和数据都还在，随时可以恢复；到期自动彻底删除</p>` + bin.map((d) => `<div class="item" data-sub="${esc(d.sub)}"><div class="l"><b>🗑 ${esc(d.name || d.sub)} <span>${esc(d.sub)}</span></b>
		<span>${day(d.delAt)} ${d.delWhy === 'idle' ? '因为 90 天没上线被放进回收站' : '删除'} · <b style="display:inline;color:var(--danger)">${day(d.purgeAt)} 彻底删除</b>${d.exp ? ' · 到期 ' + day(d.exp) : ' · 不限期'} · ${(d.users || []).length} 个账号</span></div>
		<div class="acts"><button class="btn sm primary" data-op="restore">恢复</button><button class="btn sm danger" data-op="purge">彻底删除</button></div></div>`).join('') : '');
}
$('q').oninput = renderDevs;
// 标已修复 / 撤回：可以写补充说明，选择要不要发邮件告诉对方
// 对方怎么收到回复：邮件；面板里发的，打开面板时看到；终端上报和官网报告，用编号查、重新安装时看到
function fbReach(f) {
	const r = [], c = f.code ? String(f.code).toUpperCase() : '';
	if ((f.mailTo || []).length) r.push('邮件');
	if (c && f.sub) r.push('对方打开面板时看到');
	else if (c && f.kind === 'install') r.push('对方重新运行安装命令、或打开查询网址时看到');
	else if (c) r.push('对方打开查询网址时看到');
	return { c, txt: r.length ? r.join('，') : '这条是旧版本发来的，没有编号也没有邮箱，对方收不到回复' };
}
// 进度条：只有三段（反馈成功 → 开发人员已收到 → 已修复 / 无法修复）；补充说明写在下面的处理记录里
const FB_ST = { fixed: '标为已修复', nofix: '标为无法修复', open: '撤回为未处理', note: '发了补充说明' };
const fbStage = (f) => (f.done || f.nofix ? 3 : f.ack ? 2 : 1);
function fbSteps(stage, nofix) {
	return `<div class="fsteps" data-stage="${stage}">${['反馈成功', '开发人员已收到', '已修复'].map((x, i) => { const on = i < stage, bad = on && i === 2 && nofix;
		return `<div class="${on ? (bad ? 'on bad' : 'on') : 'off'}${i === stage - 1 ? ' cur' : ''}"><i>${bad ? '✕' : on ? '✓' : i + 1}</i><b>${bad ? '无法修复' : x}</b></div>`; }).join('')}</div>`;
}
const FB_DLG = {
	fixed: { t: '标为已修复', l: '补充说明（可以不写）', ph: '比如：已在 3.0.1 修好，到面板「一键更新」更新一下就行' },
	nofix: { t: '标为无法修复', l: '没法修复的原因（必须写，如实告诉对方）', ph: '比如：这是路由器固件自带的问题，面板这边改不了。可以换成 Kwrt 稳定版再试', need: 1 },
	open: { t: '撤回为未处理', l: '补充说明（可以不写）', ph: '比如：还有一种情况没修好，正在继续查' },
	note: { t: '发补充说明', l: '补充说明（进度不变，对方会看到）', ph: '比如：已经找到原因了，下个版本修', need: 1 },
};
function fbDoneDialog(f, kind) {
	return new Promise((ok) => {
		const to = f.mailTo || [], d = FB_DLG[kind], el = document.createElement('div'); el.className = 'dlg';
		el.innerHTML = `<div class="card"><h3>${d.t}</h3>
			<p class="muted" style="margin:4px 0 10px;font-size:13px;line-height:1.55;white-space:pre-wrap;max-height:84px;overflow:auto">${esc((f.text || '').slice(0, 300))}</p>
			<label class="f">${d.l}<span class="muted" style="display:block;font-size:12.5px;font-weight:400;margin-top:2px">对方怎么看到：${esc(fbReach(f).txt)}</span></label><textarea class="input" data-note rows="4" maxlength="2000" placeholder="${esc(d.ph)}" style="resize:vertical"></textarea>
			<p class="err hidden" data-err style="margin:6px 0 0">${kind === 'nofix' ? '写一下为什么没法修复' : '补充说明不能是空的'}</p>
			<label style="display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:14px;line-height:1.5"><input type="checkbox" data-mail ${to.length ? 'checked' : 'disabled'} style="margin-top:3px"><span>${to.length ? '发邮件告诉对方：' + esc(to.join('、')) : '对方没留邮箱，发不了邮件'}</span></label>
			<div class="g3" style="margin-top:12px"><button class="btn" data-x>取消</button><button class="btn ${kind === 'nofix' ? 'danger' : 'primary'}" data-go>${d.t}</button></div></div>`;
		document.body.appendChild(el);
		const close = (v) => { el.remove(); ok(v); };
		el.querySelector('[data-x]').onclick = () => close(null);
		el.onclick = (e) => { if (e.target === el) close(null); };
		el.querySelector('[data-go]').onclick = () => { const note = el.querySelector('[data-note]').value.trim(); if (d.need && !note) { el.querySelector('[data-err]').classList.remove('hidden'); return; } close({ note, mail: el.querySelector('[data-mail]').checked }); };
		el.querySelector('[data-note]').oninput = () => el.querySelector('[data-err]').classList.add('hidden');
		setTimeout(() => el.querySelector('[data-note]').focus(), 50);

$('uq').oninput = renderUsers;

/* ---------- 操作记录 ---------- */

/* ---------- 公告 ---------- */

function annEdit(a) {

$('fAnn').querySelector('[data-cancel]').onclick = () => annEdit(null);
$('fAnn').onsubmit = async (e) => {

$('anns').onclick = async (e) => {

	}

let FBS = [], FB_ALL = false;
function renderFbs() {

// 截图要带管理员密钥才能拿，拿到后在页面里显示；点开看大图
const IMG = {};

		const k = b.dataset.img;
		if (!IMG[k]) { try { const r = await fetch('/api/admin/feedback/' + k.replace(':', '/img/'), { headers: hdr() }); if (!r.ok) throw 0; IMG[k] = URL.createObjectURL(await r.blob()); } catch (x) { b.innerHTML = '<span class="muted">截图读不出来</span>'; continue; } }

$('fbs').onclick = async (e) => {
