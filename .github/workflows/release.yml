# 发布新版本：在 GitHub 网页的 Actions → 「发布新版本」→ Run workflow，填版本号（例如 v1.0.0）
# 会自动打安装包（自建版、托管版的通用包和各个具体版本的包）并签名、打安卓 App，创建 Release 并上传
# App 的代码这次没改的话，app-version.json 里写的是 App 上次改动的版本，App 不会弹更新；改了才提示。强不强制看更新说明（tools/app-version.sh，规则跟路由器一样：「最低版本：x.y.z【必须更新】」的 x.y.z 是这一版才强制）
name: 发布新版本
on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（例如 v1.0.0）
        required: true
        default: v1.0.0
      prerelease:
        description: 先发给尝鲜用户（标成「预发布」；正式用户收不到，觉得没问题再在 GitHub 上把「预发布」去掉，就变成正式版）
        type: boolean
        default: false
      drop_old_key:
        description: 不再给 6.0 以前的老路由器签名（只有大家都升到 6.0、已经删掉旧密钥 RELEASE_SIGN_KEY 时才勾；不勾时缺旧密钥会拒绝发布）
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write      # 安装包来源证明（GitHub 签发，说明是这个仓库的这次构建打出来的）
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # 要完整历史和标签：算 App 上次改动是哪个版本
      - name: 装面板精简工具
        run: npm ci --prefix tools/minify --no-audit --no-fund
      # 手动输入的版本号先放进环境变量再用（不直接拼进命令里）
      - name: 打包
        env:
          HUB_URL: ${{ vars.HUB_URL }}
          VERSION: ${{ inputs.version }}
        run: sh tools/pack.sh "$VERSION"
      # 安全加固：给校验值文件签名，路由器一键更新时验签（官网被人改了也装不上假的安装包）。
      # 6.0 起用新密钥（仓库密钥 RELEASE_SIGN_KEY_V6）签 SHA256SUMS.sig2，6.0 起的路由器只认它；没设置就不发布
      - name: 给安装包签名（新密钥）
        env:
          RELEASE_SIGN_KEY_V6: ${{ secrets.RELEASE_SIGN_KEY_V6 }}
        run: node tools/sign.mjs dist/SHA256SUMS
      # 还没升到 6.0 的老路由器（v5.2.1–5.2.3 会验签）只认旧密钥：用旧密钥 RELEASE_SIGN_KEY 再签一份 SHA256SUMS.sig，让它们能升上来。
      # 6.0 第 86 项：缺旧密钥就拒绝发布（以前只提示一句照样发，老路由器会因此升不上来）。
      # 大家都升到 6.0、在仓库设置里删掉 RELEASE_SIGN_KEY 以后，发布时勾上「不再给 6.0 以前的老路由器签名」
      - name: 给安装包签名（旧密钥，给老路由器升级用）
        env:
          RELEASE_SIGN_KEY: ${{ secrets.RELEASE_SIGN_KEY }}
          DROP_OLD: ${{ inputs.drop_old_key }}
        run: |
          if [ -n "$RELEASE_SIGN_KEY" ]; then node tools/sign.mjs --old dist/SHA256SUMS
          elif [ "$DROP_OLD" = true ]; then echo "::notice::按选择不再用旧密钥签名：6.0 以前的老路由器没法一键更新了，只能用安装命令手动升级"
          else echo "::error::没有旧密钥 RELEASE_SIGN_KEY：v5.2.1–5.2.3 的路由器会验签失败、升不上来，已停止发布。把旧密钥加回仓库设置再发；确定不再管老路由器的话，发布时勾上「不再给 6.0 以前的老路由器签名」"; exit 1; fi
      # 来源证明：任何人都能用 gh attestation verify 查安装包是不是这个仓库的 GitHub Actions 打出来的；出错也不影响发布
      - name: 安装包来源证明
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.tar.gz'
      - name: App 版本（App 没改就不让 App 弹更新）
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sh tools/app-version.sh "$VERSION" > dist/app-version.json
          echo "::notice::App 版本：$(jq -r .version dist/app-version.json)（跟这次发布的版本一样 = App 改了，会提示用户必须更新；不一样 = App 没改，不弹更新）"
      - name: 创建 Release 并上传安装包
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRE: ${{ inputs.prerelease }}
        run: |
          gh release create "$VERSION" dist/*.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sig* dist/app-version.json \
            --target "$GITHUB_SHA" \
            $([ "$PRE" = true ] && echo --prerelease) \
            --title "$VERSION：托管版 + 自建版 + 安卓 App" \
            --notes-file tools/release-notes.md
      # 6.0.1 起每个版本带一个 V0（正式版原样的热补丁，预发布 hot-版本-0）：后台「全部退回」「按台退回」能一直退回原样（用户 11/28）
      - name: 发 V0（正式版原样，退回补丁用）
        continue-on-error: true   # 没发成也不挡安卓 App 和正式版（以后手动用「发热补丁」补发编号 0）
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_SIGN_KEY_V6: ${{ secrets.RELEASE_SIGN_KEY_V6 }}
        run: |
          B="${VERSION#v}"
          sh tools/hot.sh "$B" 0 "正式版原样"
          node tools/sign.mjs dist-hot/SHA256SUMS
          printf '正式版原样\n\n只给 v%s 的路由器，后台退回补丁时用。\n' "$B" > dist-hot/notes.md
          gh release create "hot-$B-0" dist-hot/hot.tar.gz dist-hot/SHA256SUMS dist-hot/SHA256SUMS.sig2 --target "$GITHUB_SHA" --prerelease --title "热补丁 hot-$B-0（正式版原样）" --notes-file dist-hot/notes.md
      # 依赖清单（SBOM）：列出用到的所有第三方组件，跟安装包一起放进 Release；出错也不影响发布
      - name: 生成依赖清单（SBOM）
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: 上传依赖清单
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: '[ -s sbom.spdx.json ] && gh release upload "$VERSION" sbom.spdx.json --clobber || echo "没有生成依赖清单，跳过"'
  android:
    needs: release
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ inputs.version }}
      release: true
    secrets: inherit
