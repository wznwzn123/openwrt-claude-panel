<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>路由器面板</title>
<script>window.setDark=function(d){document.documentElement.classList.toggle('dark',!!d)};try{setDark(window.App&&App.dark?App.dark():matchMedia('(prefers-color-scheme: dark)').matches)}catch(e){}</script>
<style>
:root{--bg:#eef1f8;--card:rgba(255,255,255,.66);--text:#0b0b0f;--muted:#6e6e73;--line:rgba(60,60,67,.14);--fill:rgba(118,118,128,.14);--brand:#007aff;--ok:#34c759;--danger:#ff3b30;--shadow:inset 0 0 0 .5px rgba(255,255,255,.65),0 8px 28px rgba(31,38,80,.08)}
/* 深色：由 App 告诉页面（老版本系统 WebView 不认系统深色设置），浏览器预览时看系统 */
:root.dark{--bg:#0b1024;--card:rgba(28,28,32,.58);--text:#f5f5f7;--muted:#98989f;--line:rgba(255,255,255,.1);--fill:rgba(118,118,128,.26);--brand:#0a84ff;--shadow:inset 0 0 0 .5px rgba(255,255,255,.09),0 8px 28px rgba(0,0,0,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--text);font:15px/1.55 -apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;background:var(--bg);-webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;inset:-40px;z-index:-1;filter:blur(20px);background:radial-gradient(60% 50% at 12% 8%,#c3d2ff 0,transparent 70%),radial-gradient(55% 45% at 92% 18%,#f6cdf0 0,transparent 70%),radial-gradient(70% 55% at 30% 95%,#b8ecff 0,transparent 70%),var(--bg)}
:root.dark body::before{background:radial-gradient(55% 45% at 15% 10%,#3a2c8f 0,transparent 70%),radial-gradient(50% 45% at 90% 25%,#13527a 0,transparent 70%),radial-gradient(70% 55% at 40% 100%,#4b1e6b 0,transparent 70%),#0b1024}
.wrap{padding:18px 16px 40px;max-width:640px;margin:auto}
.head{display:flex;align-items:center;gap:12px;margin:8px 4px 18px}
.head i{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#6a7bff,#1fb5e6);color:#fff;font-style:normal;font-size:22px}
.head b{font-size:22px;letter-spacing:-.02em}
.head .logo{width:44px;height:44px;flex:none;filter:drop-shadow(0 4px 10px rgba(47,107,255,.3))}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border:0;border-radius:99px;background:var(--fill);color:var(--text);font:inherit;font-weight:650;cursor:pointer}
.btn:active{transform:scale(.96)}.btn.primary{background:var(--brand);color:#fff}.btn.danger{color:var(--danger)}.btn.sm{padding:7px 13px;font-size:13.5px}
.btn:disabled{opacity:.5}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:16px 0 12px}
.acts .btn{padding:14px 8px;border-radius:18px;flex-direction:column;gap:4px}
.acts .btn span{font-size:24px}
.acts .full{grid-column:1/-1;flex-direction:row}
h2{font-size:18px;margin:22px 4px 10px;letter-spacing:-.02em}
.r{display:flex;align-items:center;gap:12px}
.r .ic{width:44px;height:44px;flex:none;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#6a4dff,#2f6bff 55%,#00c2d8);color:#fff;--card-solid:#2f6bff}
.r .t{flex:1;min-width:0}.r .t b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.r .t span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.r .more{display:flex;gap:6px;margin-top:10px}
.muted{color:var(--muted)}
.tip{font-size:13.5px;color:var(--muted);line-height:1.7;margin:0}
.upd{border:1.5px solid var(--brand)}
.upd p{margin:6px 0 10px;font-size:13.5px;color:var(--muted);white-space:pre-line;max-height:120px;overflow:auto}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal .box{width:100%;max-width:420px;background:var(--bg);border-radius:24px;padding:22px 20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0 0 4px;font-size:19px}.modal .v{color:var(--muted);font-size:13px}
.modal .notes{margin:12px 0 16px;font-size:14px;line-height:1.65;white-space:pre-line;max-height:40vh;overflow:auto;color:var(--text)}
.modal .must{margin:-6px 0 14px;font-size:13px;color:var(--danger);font-weight:600}
.modal .btn{width:100%}.modal .later{margin-top:8px;background:none;color:var(--muted)}
.foot{text-align:center;font-size:12.5px;color:var(--muted);margin-top:26px}
.foot a{color:var(--brand);font-weight:600;text-decoration:none}
.hidden{display:none!important}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1;min-width:0;padding:11px 14px;border-radius:14px;border:0;background:var(--fill);color:var(--text);font:inherit;font-size:14px;outline:none;-webkit-user-select:text;user-select:text}
.add input:focus{box-shadow:0 0 0 2px var(--brand)}
.aerr{color:var(--danger);font-size:13px;margin:8px 2px 0}
.aerr:empty{display:none}
</style></head><body><div class="wrap">
<div class="head"><svg class="logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a4dff"/><stop offset=".5" stop-color="#2f6bff"/><stop offset="1" stop-color="#00c2d8"/></linearGradient><radialGradient id="lp" cx=".88" cy=".08" r=".8"><stop offset="0" stop-color="#ff5fb4" stop-opacity=".75"/><stop offset=".7" stop-color="#ff5fb4" stop-opacity="0"/></radialGradient><radialGradient id="lw" cx=".3" cy="0" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="32" height="32" rx="8.9" fill="url(#lg)"/><rect width="32" height="32" rx="8.9" fill="url(#lp)"/><rect width="32" height="32" rx="8.9" fill="url(#lw)"/><g transform="translate(0 0) scale(1)"><path d="M11.2 12.6a6.8 6.8 0 0 1 9.6 0" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M8.4 9.8a10.8 10.8 0 0 1 15.2 0" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-linecap="round" fill="none"/><rect x="7.5" y="16" width="17" height="7.5" rx="2.4" fill="#fff"/><circle cx="11.4" cy="19.75" r="1.1" fill="#2f6bff"/><circle cx="14.6" cy="19.75" r="1.1" fill="#2f6bff"/><path d="M18 19.75h3.4" stroke="#2f6bff" stroke-width="1.6" stroke-linecap="round"/></g></svg><div><b>路由器面板</b><div class="muted" style="font-size:13px">管理家里的 OpenWrt 路由器</div></div></div>

<div class="card upd hidden" id="upd"><b>发现新版本 <span id="updV"></span></b><p id="updN"></p><button class="btn primary" id="updBtn" style="width:100%">更新</button></div>

<div class="acts">
	<button class="btn" id="scanBtn"><span>📷</span>扫码</button>
	<button class="btn" id="albumBtn"><span>🖼️</span>相册识别</button>
	<button class="btn" id="pasteBtn"><span>📋</span>粘贴</button>
	<button class="btn full hidden" id="hubBtn">👤 官网账号（我的路由器）</button>
</div>

<div class="card"><b style="font-size:15px">手动添加</b><div class="muted" style="font-size:13px;margin-top:2px">粘贴或输入登录地址（安装完成时终端里显示的那个）</div>
	<form class="add" id="addForm" autocomplete="off"><input id="addr" type="url" inputmode="url" placeholder="https://…/cgi-bin/mcp/…" autocapitalize="off" spellcheck="false"><button class="btn primary" id="addBtn">添加</button></form>
	<div class="aerr" id="aerr"></div>
</div>

<h2>我的路由器</h2>
<div id="list"></div>

<h2>怎么添加</h2>
<div class="card"><p class="tip">
	<b>扫码</b>：在已经能用的手机上打开面板，「系统操作 → 添加新手机」，用这里的「扫码」扫一下。<br>
	<b>相册识别</b>：二维码在截图里（比如别人发给你的），点「相册识别」选那张图。<br>
	<b>粘贴 / 手动添加</b>：复制安装时显示的登录地址（<code>https://…/cgi-bin/mcp/…</code>），点「粘贴」，或者填到上面的框里点「添加」。<br>
	登录密钥只保存在这台手机上，不会上传到任何地方。
</p></div>

<div class="modal hidden" id="updModal" role="dialog" aria-modal="true"><div class="box">
	<h3>发现新版本</h3><div class="v" id="umV"></div>
	<div class="notes" id="umN"></div>
	<div class="must hidden" id="umMust">这个版本必须更新，更新后才能继续使用。</div>
	<button class="btn primary" id="umGo">立即更新</button>
	<button class="btn later" id="umLater">以后再说</button>
</div></div>

<div class="foot">版本 <span id="ver"></span> · <a href="#" id="chk">检查更新</a></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const A = window.App || { version: () => 'dev', hub: () => '', routers: () => '[]', saveRouters() {}, open: (u) => (location.href = u), external: (u) => window.open(u), scan: () => alert('只有 App 里能扫码'), pickQr: () => alert('只有 App 里能从相册识别'), clipboard: () => '', update() {} };
const HUB = (A.hub() || '').replace(/\/$/, '');
$('ver').textContent = A.version();
// 认出扫到或粘贴的内容：登录地址 / 面板 + #login / 官网配对链接
function parse(t) {
	t = String(t || '').trim();
	let m = /^https:\/\/([a-z0-9.-]+(?::\d+)?)\/cgi-bin\/mcp\/([A-Za-z0-9]{16,64})\/?$/i.exec(t);
	if (m) return 'https://' + m[1] + '/panel/#login=' + m[2];
	m = /^https:\/\/([a-z0-9.-]+(?::\d+)?)\/panel\/(?:index\.html)?(#login=[A-Za-z0-9]{16,64})?$/i.exec(t);
	if (m) return 'https://' + m[1] + '/panel/' + (m[2] || '');
	if (HUB && t.startsWith(HUB + '/app?pair=') && /^[^\s]+\/app\?pair=[A-Za-z2-9]{6,12}$/.test(t)) return t;
	return null;
}
function onScan(t) { const u = parse(t); if (u) A.open(u); else alert('这个二维码不是路由器面板的。请扫面板里「添加新手机」或「绑定到账号」的二维码。'); }
$('scanBtn').onclick = () => A.scan();
$('albumBtn').onclick = () => A.pickQr();
// 手动添加：认得出来就直接打开，认不出来就在框下面说明原因（不弹窗）
const BADADDR = '这不是登录地址。登录地址像这样：https://xxx/cgi-bin/mcp/一串字母数字（安装完成时终端里显示的那个）';
function tryAdd(t) {
	const u = parse(t);
	$('aerr').textContent = u || !t ? '' : BADADDR;
	if (u) { $('addr').value = ''; A.open(u); }
	return !!u;
}
$('addForm').onsubmit = (e) => { e.preventDefault(); const t = $('addr').value.trim(); if (!t) { $('aerr').textContent = '先粘贴或输入登录地址'; $('addr').focus(); return; } tryAdd(t); };
$('addr').oninput = () => ($('aerr').textContent = '');
// 粘贴：用手机系统的剪贴板（网页自己读剪贴板在 App 里常被拦）；剪贴板里不是登录地址，就放进框里给你看
$('pasteBtn').onclick = async () => {
	let t = '';
	try { t = (A.clipboard && A.clipboard()) || ''; } catch (e) {}
	if (!t) { try { t = await Promise.race([navigator.clipboard.readText(), new Promise((r) => setTimeout(() => r(''), 1500))]); } catch (e) {} }
	t = String(t || '').trim();
	if (!t) { $('aerr').textContent = '剪贴板是空的。先去复制登录地址，再回来点「粘贴」；或者直接填到上面的框里。'; $('addr').focus(); return; }
	if (!tryAdd(t)) $('addr').value = t.slice(0, 300);
};
if (HUB) { $('hubBtn').classList.remove('hidden'); $('hubBtn').onclick = () => A.open(HUB + '/app'); }
const ago = (t) => { if (!t) return ''; const s = (Date.now() - t) / 1000; return s < 3600 ? '刚刚打开过' : s < 86400 ? Math.round(s / 3600) + ' 小时前打开' : Math.round(s / 86400) + ' 天前打开'; };
function refresh() {
	let list = [];
	try { list = JSON.parse(A.routers()); } catch (e) {}
	list.sort((a, b) => (b.at || 0) - (a.at || 0));
	$('list').innerHTML = list.length ? list.map((r, i) => `<div class="card" data-i="${i}"><div class="r"><div class="ic"><svg viewBox="6 7 20 18" width="24" height="24" aria-hidden="true"><path d="M11.2 12.6a6.8 6.8 0 0 1 9.6 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M8.4 9.8a10.8 10.8 0 0 1 15.2 0" stroke="currentColor" stroke-opacity=".5" stroke-width="2" stroke-linecap="round" fill="none"/><rect x="7.5" y="16" width="17" height="7.5" rx="2.4" fill="currentColor"/><circle cx="11.4" cy="19.75" r="1.1" fill="var(--card-solid)"/><circle cx="14.6" cy="19.75" r="1.1" fill="var(--card-solid)"/><path d="M18 19.75h3.4" stroke="var(--card-solid)" stroke-width="1.6" stroke-linecap="round"/></svg></div><div class="t"><b>${esc(r.name)}</b><span>${esc(r.url.replace(/^https:\/\//, '').replace(/\/panel\/$/, ''))} · ${ago(r.at)}</span></div><button class="btn primary sm" data-open>打开</button></div>
		<div class="more"><button class="btn sm" data-ren>改名</button><button class="btn sm danger" data-del>移除</button></div></div>`).join('')
		: '<div class="card"><p class="tip" style="text-align:center">还没有路由器。点上面的「扫码添加」或「粘贴登录地址」。</p></div>';
	$('list').querySelectorAll('[data-i]').forEach((el) => {
		const r = list[+el.dataset.i];
		el.querySelector('[data-open]').onclick = () => A.open(r.url);
		el.querySelector('[data-ren]').onclick = () => { const n = prompt('给这台路由器起个名字：', r.name); if (n && n.trim()) { r.name = n.trim().slice(0, 30); A.saveRouters(JSON.stringify(list)); refresh(); } };
		el.querySelector('[data-del]').onclick = () => { if (!confirm('从列表里移除「' + r.name + '」？路由器本身不受影响，以后可以重新扫码添加。')) return; list.splice(+el.dataset.i, 1); A.saveRouters(JSON.stringify(list)); refresh(); };
	});
}
// 检查更新：问托管服务最新版本号，比现在的新就提示
const vnum = (v) => String(v || '').replace(/^v/, '').split('.').map((x) => parseInt(x, 10) || 0);
const newer = (a, b) => { const x = vnum(a), y = vnum(b); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; };
// 有新版本：一打开 App 就弹窗；「以后再说」当天这个版本不再弹（首页的更新卡片还在）
// 必须更新（发布说明里写了【必须更新】，或者现在的版本低于「最低版本」）：弹窗关不掉
function startUpdate(j) {
	const url = HUB + (j.apk || '/app/router-panel.apk');
	for (const b of [$('updBtn'), $('umGo')]) { b.disabled = true; b.textContent = '正在下载…'; }
	A.update(url);
}
function showUpdate(j, force) {
	$('umV').textContent = '现在 ' + A.version() + ' → 新版 ' + j.version;
	$('umN').textContent = j.notes || '修复了一些问题，体验更好。';
	$('umMust').classList.toggle('hidden', !force);
	$('umLater').classList.toggle('hidden', force);
	$('umGo').onclick = () => startUpdate(j);
	$('umLater').onclick = () => { try { localStorage.setItem('upd_later', j.version + '@' + new Date().toDateString()); } catch (e) {} $('updModal').classList.add('hidden'); };
	$('updModal').classList.remove('hidden');
}
async function checkUpdate(manual) {
	if (!HUB) { if (manual) alert('这个版本没有设置更新地址'); return; }
	try {
		const j = await (await fetch(HUB + '/api/app/version', { cache: 'no-store' })).json();
		if (j.version && newer(j.version, A.version())) {
			$('updV').textContent = j.version; $('updN').textContent = j.notes || '';
			$('upd').classList.remove('hidden');
			$('updBtn').onclick = () => startUpdate(j);
			const force = !!j.force || (!!j.min && newer(j.min, A.version()));
			let later = ''; try { later = localStorage.getItem('upd_later') || ''; } catch (e) {}
			if (manual || force || later !== j.version + '@' + new Date().toDateString()) showUpdate(j, force);
		} else if (manual) alert('已经是最新版（' + A.version() + '）');
	} catch (e) { if (manual) alert('检查更新失败，稍后再试'); }
}
function onUpdateFail() { $('updBtn').disabled = false; $('updBtn').textContent = '更新'; $('umGo').disabled = false; $('umGo').textContent = '立即更新'; }
$('chk').onclick = (e) => { e.preventDefault(); checkUpdate(true); };
refresh();
checkUpdate(false);
</script></body></html>
