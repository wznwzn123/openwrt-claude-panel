# 发热补丁：Actions →「发热补丁」→ Run workflow，填基础版本（例如 6.0.0）、编号（这个版本的第几个补丁，比上一个大）、一句话说明
# 只换面板网页、接口、小工具脚本和远程数据（路由器上的 cmcp-hot 只认这些），用跟正式版同一把密钥签名；
# 发成「预发布」（hot-6.0.0-3），不会变成最新正式版。官网分批推（尝鲜 → 10% → 50% → 全部，每批 6 小时，一台装失败就暂停，后台「补丁」页管），
# 轮到的路由器自动静默装上，装不好自动退回
name: 发热补丁
on:
  workflow_dispatch:
    inputs:
      base:
        description: 给哪个版本（例如 6.0.0）
        required: true
      n:
        description: 第几个补丁（比这个版本上一个补丁大，从 1 开始；0 = 正式版原样，发版时自动发，没发成才在这里补）
        required: true
      notes:
        description: 一句话说明（会记在用户的「通知」里）
        required: true
permissions:
  contents: write
jobs:
  hot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 装面板精简工具
        run: npm ci --prefix tools/minify --no-audit --no-fund
      - name: 打补丁
        env:
          BASE: ${{ inputs.base }}
          N: ${{ inputs.n }}
          NOTES: ${{ inputs.notes }}
        run: sh tools/hot.sh "$BASE" "$N" "$NOTES"
      - name: 签名（跟正式版同一把新密钥）
        env:
          RELEASE_SIGN_KEY_V6: ${{ secrets.RELEASE_SIGN_KEY_V6 }}
        run: node tools/sign.mjs dist-hot/SHA256SUMS
      - name: 发布成预发布
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ inputs.base }}
          N: ${{ inputs.n }}
          NOTES: ${{ inputs.notes }}
        run: |
          TAG="hot-$BASE-$N"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "::error::$TAG 已经发过了，编号要换一个更大的"; exit 1; fi
          printf '%s\n\n只给 v%s 的路由器，自动静默安装。\n' "$NOTES" "$BASE" > dist-hot/notes.md
          gh release create "$TAG" dist-hot/hot.tar.gz dist-hot/SHA256SUMS dist-hot/SHA256SUMS.sig2 --target "$GITHUB_SHA" --prerelease --title "热补丁 $TAG" --notes-file dist-hot/notes.md
