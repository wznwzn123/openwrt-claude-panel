name: Cloud website recording (isolated)

on:
  push:
    branches:
      - chore/cloud-website-recording

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout this branch only
        uses: actions/checkout@v4
        with:
          ref: chore/cloud-website-recording

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser and video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Record public website pages
        run: |
          mkdir -p recordings/raw recordings/mp4
          cat > record.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          import path from 'node:path';

          const base = 'https://yrlove520.com';
          const pages = [
            ['首页', '/'],
            ['功能展示', '/#features'],
            ['界面展示', '/#tour'],
            ['安装教程', '/#start'],
            ['版本与应用', '/#plans'],
            ['常见问题', '/#faq'],
            ['更新日志', '/changelog'],
            ['登录页面', '/app'],
            ['注册入口', '/app#reg'],
            ['帮助中心', '/help'],
            ['服务状态', '/status'],
            ['安全说明', '/security'],
            ['隐私政策', '/privacy'],
            ['使用协议', '/terms'],
            ['用户须知', '/notice'],
            ['处理进度查询', '/r']
          ];

          const browser = await chromium.launch({ headless: true });
          const orderedFiles = [];
          for (let i = 0; i < pages.length; i++) {
            const [label, route] = pages[i];
            const context = await browser.newContext({
              viewport: { width: 1920, height: 1080 },
              recordVideo: {
                dir: 'recordings/raw',
                size: { width: 1920, height: 1080 }
              },
              deviceScaleFactor: 1
            });
            const page = await context.newPage();
            console.log('Recording:', label, base + route);
            try {
              await page.goto(base + route, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(2500);
              // Smoothly traverse the page so long sections are visible in the recording.
              const height = await page.evaluate(() => document.documentElement.scrollHeight);
              const steps = Math.max(1, Math.ceil(height / 650));
              for (let s = 1; s <= steps; s++) {
                await page.evaluate(y => window.scrollTo({ top: y, behavior: 'smooth' }),
                  Math.round((height - 900) * s / steps));
                await page.waitForTimeout(700);
              }
              await page.evaluate(() => window.scrollTo({ top: 0, behavior: 'smooth' }));
              await page.waitForTimeout(900);
            } catch (error) {
              console.log('Page capture warning:', label, String(error));
            }
            const video = page.video();
            await page.close();
            await context.close();
            if (video) orderedFiles.push(await video.path());
          }
          await browser.close();

          if (!orderedFiles.length) throw new Error('No browser recordings were produced.');
          const list = orderedFiles.map((src, i) => {
            const dst = path.resolve('recordings/mp4', String(i).padStart(2, '0') + '.mp4');
            return { src, dst };
          });
          for (const item of list) {
            const { spawnSync } = await import('node:child_process');
            const result = spawnSync('ffmpeg', ['-y', '-i', item.src, '-an',
              '-c:v', 'libx264', '-preset', 'veryfast', '-crf', '22',
              '-pix_fmt', 'yuv420p', '-movflags', '+faststart', item.dst],
              { stdio: 'inherit' });
            if (result.status !== 0) throw new Error('MP4 conversion failed: ' + item.src);
          }
          await fs.writeFile('recordings/concat.txt',
            list.map(x => "file '" + x.dst.replaceAll("'", "'\\''") + "'").join('\n') + '\n');
          const { spawnSync } = await import('node:child_process');
          const joined = spawnSync('ffmpeg', ['-y', '-f', 'concat', '-safe', '0',
            '-i', 'recordings/concat.txt', '-c', 'copy',
            'recordings/yrlove520-website-tour.mp4'], { stdio: 'inherit' });
          if (joined.status !== 0) throw new Error('Final video assembly failed.');
          console.log('Recording completed:', list.length, 'clips');
          EOF
          node record.mjs

      - name: Upload MP4 as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: yrlove520-website-recording
          path: recordings/yrlove520-website-tour.mp4
          retention-days: 7
          if-no-files-found: error
