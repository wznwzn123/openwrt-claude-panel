# 安卓 App 自检：打测试包 → 在模拟器上安装打开 → 截图推到 ci-shots 分支 → 打印包信息
name: 安卓 App 自检
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: 打测试包
        run: |
          gradle -p android --no-daemon assembleRelease assembleDebug -PVERSION_NAME=0.0.1 -PVERSION_CODE=1 -PHUB_URL=https://example.com
          cp android/app/build/outputs/apk/release/app-release.apk router-panel-release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk router-panel.apk
      - name: 包信息
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "::notice::$($BT/aapt2 dump badging router-panel-release.apk | head -1)"
          echo "::notice::权限：$($BT/aapt2 dump permissions router-panel-release.apk | grep -o "name='[^']*'" | tr '\n' ' ')"
          echo "::notice::正式包大小 $(stat -c %s router-panel-release.apk) 字节"
      - name: 打开 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 模拟器里运行
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: sh android/ci-smoke.sh
      - name: 截图推到 ci-shots 分支
        if: always()
        run: |
          [ -d shots ] || exit 0
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git checkout --orphan ci-shots-tmp
          git rm -rq --cached . && git clean -fdq -e shots
          git add shots && git commit -qm "安卓自检截图 ${{ github.run_id }}"
          git push -f origin HEAD:ci-shots
