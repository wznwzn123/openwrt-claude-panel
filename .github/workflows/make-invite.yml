# 生成邀请码：Actions →「生成邀请码」→ Run workflow，填人数、码几天内能用、开通后试用几天、备注；生成的邀请码显示在运行结果的提示里
name: 生成邀请码
on:
  workflow_dispatch:
    inputs:
      max:
        description: 最多几个人能用
        required: true
        default: '20'
      days:
        description: 这个码几天内能用来开通（0 = 一直能用）
        required: true
        default: '7'
      svc:
        description: 开通后试用几天（0 = 不限期）
        required: true
        default: '7'
      note:
        description: 备注（自己看的，比如：酷安第一帖）
        required: false
        default: ''
permissions:
  contents: read
jobs:
  invite:
    runs-on: ubuntu-latest
    env:
      HUB: ${{ vars.HUB_URL }}
      AK: ${{ secrets.HUB_ADMIN_KEY }}
      # 管理后台开了两步验证的话：把开启时显示的那串密钥存成 Secrets 里的 HUB_TOTP_SECRET，这里现算验证码（没开就是空的，不影响）
      TS: ${{ secrets.HUB_TOTP_SECRET }}
      OTPJS: 'const c=require("crypto"),s=(process.env.TS||"").toUpperCase().replace(/[^A-Z2-7]/g,"");if(!s)process.exit(0);let b=0,v=0,o=[];for(const ch of s){v=(v<<5)|"ABCDEFGHIJKLMNOPQRSTUVWXYZ234567".indexOf(ch);b+=5;if(b>=8){o.push((v>>>(b-8))&255);b-=8}}const t=Buffer.alloc(8);t.writeBigUInt64BE(BigInt(Math.floor(Date.now()/3e4)));const h=c.createHmac("sha1",Buffer.from(o)).update(t).digest(),f=h[19]&15;process.stdout.write(String((h.readUInt32BE(f)&2147483647)%1e6).padStart(6,"0"))'
      MAX: ${{ inputs.max }}
      DAYS: ${{ inputs.days }}
      NOTE: ${{ inputs.note }}
      SVC: ${{ inputs.svc }}
    steps:
      - name: 生成
        run: |
          [ -n "$HUB" ] && [ -n "$AK" ] || { echo "::error::没有设置 HUB_URL 或 HUB_ADMIN_KEY"; exit 1; }
          B=$(jq -nc --arg m "$MAX" --arg d "$DAYS" --arg n "$NOTE" --arg s "$SVC" '{max: ($m|tonumber), days: ($d|tonumber), svc: ($s|tonumber), note: $n}')
          R=$(curl -sS -m 20 -X POST -H "Authorization: Bearer $AK" -H "x-adm-otp: $(node -e "$OTPJS")" -H 'Content-Type: application/json' -d "$B" "$HUB/api/admin/invites")
          C=$(echo "$R" | jq -r '.invite.code // empty')
          [ -n "$C" ] || { echo "::error::生成失败：$R"; exit 1; }
          echo "::notice::邀请码：$C（最多 $MAX 人，$( [ "$DAYS" = 0 ] && echo 一直能用 || echo "$DAYS 天内能用")，$( [ "$SVC" = 0 ] && echo 开通后不限期 || echo "开通后试用 $SVC 天")）"
          R=$(curl -sS -m 20 "$HUB/api/ping")
          echo "::notice::托管服务现在一共 $(echo "$R" | jq -r .count) 台路由器（上限 $(echo "$R" | jq -r .max)）"
