<style>
.capm{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:16px;background:rgba(10,14,24,.46);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.capm .capc{width:100%;max-width:380px;border-radius:22px;padding:22px 20px 18px;background:var(--p-surface,#fff);color:var(--ink,#111);box-shadow:0 24px 60px rgba(0,0,0,.28)}
.capm h3{margin:0 0 6px;font-size:18px}
.capm p{margin:0 0 14px;font-size:14px;line-height:1.7;opacity:.78;text-wrap:pretty}
.capm .capw{min-height:70px;display:grid;place-items:center}
.capm .cape{color:#c0392b;font-size:13.5px;line-height:1.6;margin:10px 0 0}
.capm .capx{margin-top:14px;width:100%;height:42px;border-radius:999px;border:1px solid rgba(128,128,128,.38);background:none;color:inherit;font:inherit;cursor:pointer}
@media (prefers-color-scheme:dark){.capm .capc{background:var(--p-surface,#1b1f2a);color:var(--ink,#eee)}}
</style>
<script>
// 6.0 第 66 项：人机验证（Cloudflare Turnstile）。平时不出现；同一来源短时间试太多次、或者官网开了「受攻击模式」时，
// 服务器回 { captcha: true, site }，这里弹一个小窗做验证，拿到一次性的通过凭证后由调用方重新提交。
// 验证组件用到时才从 challenges.cloudflare.com 加载；10 秒加载不出来就说明原因（不会跳过验证）
(() => {
  let loading = null;
  const loadTs = () => loading || (loading = new Promise((ok, no) => {
    if (window.turnstile) return ok();
    const s = document.createElement('script');
    s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
    s.async = true; s.onload = () => ok(); s.onerror = () => { loading = null; no(new Error('load')); };
    document.head.appendChild(s);
    setTimeout(() => { if (!window.turnstile) { loading = null; no(new Error('timeout')); } }, 10000);
  }));
  window.capSolve = (site) => new Promise((resolve) => {
    const m = document.createElement('div'); m.className = 'capm';
    m.innerHTML = '<div class="capc" role="dialog" aria-modal="true" aria-labelledby="capT"><h3 id="capT">确认是你本人在操作</h3><p>这个网络刚才试了好几次，或者官网正在防攻击<br>过了验证就继续</p><div class="capw"></div><div class="cape" hidden></div><button type="button" class="capx" data-x>取消</button></div>';
    document.body.appendChild(m);
    let done = false;
    const end = (v) => { if (done) return; done = true; if (m.isConnected) m.remove(); resolve(v); };
    m.querySelector('[data-x]').onclick = () => end(null);
    m.addEventListener('click', (e) => { if (e.target === m) end(null); });
    new MutationObserver(() => { if (!m.isConnected) end(null); }).observe(document.body, { childList: true }); // 按返回关掉了
    const err = (t) => { const e = m.querySelector('.cape'); e.textContent = t; e.hidden = false; };
    loadTs().then(() => {
      try {
        window.turnstile.render(m.querySelector('.capw'), {
          sitekey: site, language: 'zh-cn', theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light',
          callback: (tok) => setTimeout(() => end(tok), 300),
          'error-callback': () => err('验证没成功，刷新页面再试一次；还不行的话换个网络（比如关掉 Wi-Fi 用手机流量）。'),
          'expired-callback': () => err('验证过期了，再点一次。'),
        });
      } catch (e) { err('验证组件出错了，刷新页面再试一次。'); }
    }).catch(() => err('验证组件加载不出来：换个网络（比如关掉 Wi-Fi 用手机流量）或者稍后再试。'));
  });
})();
</script>
