<script type="module" src="/k/system.js"></script>
<script type="module" src="/k/motion/motion.js"></script>
<script>
// 官网各页共用：顶部阅读进度线；卡片鼠标光（电脑）和滑入扫光（手机）
(() => {
  const nav = document.querySelector('.nav');
  const prog = () => { const h = document.documentElement.scrollHeight - innerHeight; if (nav) nav.style.setProperty('--np', h > 0 ? (scrollY / h).toFixed(4) : 0); };
  addEventListener('scroll', prog, { passive: true }); addEventListener('resize', prog); prog();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
  window.fxCards = (root) => {
    const cards = [...(root || document).querySelectorAll('.fxc:not([data-fxc])')];
    cards.forEach((c) => c.setAttribute('data-fxc', ''));
    if (fine) cards.forEach((c) => {
      c.addEventListener('pointermove', (e) => { const r = c.getBoundingClientRect(); c.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%'); c.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%'); c.style.setProperty('--mo', 1); });
      c.addEventListener('pointerleave', () => c.style.setProperty('--mo', 0));
    });
    else { const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('swept'); io.unobserve(e.target); } }), { threshold: 0.3 }); cards.forEach((c) => io.observe(c)); }
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => window.fxCards()); else window.fxCards();
})();
</script>
