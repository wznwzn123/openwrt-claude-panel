<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>路由器面板</title>
<script>window.setDark=function(d){document.documentElement.classList.toggle('dark',!!d)};try{setDark(window.App&&App.dark?App.dark():matchMedia('(prefers-color-scheme: dark)').matches)}catch(e){}</script>
<style>
/* 6.0.2 起跟面板一样用「石墨」（用户 11/28 14:51 定）：冷灰底、白卡片细边框、主按钮黑色（深色白色）、线条图标。
   安卓 7 的老网页组件：不用 flex 的 gap、inset、:is、color-mix */
:root{--bg:#eceef2;--card:#fff;--text:#11151c;--muted:#6b7280;--line:rgba(17,21,28,.08);--fill:rgba(17,21,28,.06);--fill2:rgba(17,21,28,.1);--brand:#2f5bea;--danger:#d70015;--ok:#1f9d55;--shadow:0 0 0 1px rgba(17,21,28,.08),0 1px 2px rgba(17,21,28,.04),0 12px 32px -12px rgba(17,21,28,.12);--pri:#11151c;--prit:#fff}
:root.dark{--bg:#0b0c0f;--card:#15171c;--text:#eef0f4;--muted:#8b93a1;--line:rgba(255,255,255,.07);--fill:rgba(255,255,255,.07);--fill2:rgba(255,255,255,.11);--brand:#5b82ff;--danger:#ff6961;--ok:#30d158;--shadow:0 0 0 1px rgba(255,255,255,.07),inset 0 1px 0 rgba(255,255,255,.04),0 16px 40px -16px rgba(0,0,0,.8);--pri:#eef0f4;--prit:#0b0c0f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
svg{display:block}
.hidden{display:none!important}
.wrap{max-width:560px;margin:auto;padding:6px 16px 32px}
/* 顶栏 */
.head{display:flex;align-items:center;padding:12px 4px 18px}
.logo{width:36px;height:36px;border-radius:10px;flex:none;overflow:hidden;box-shadow:0 3px 10px rgba(16,28,64,.3)}
.head b{flex:1;min-width:0;margin-left:12px;font-size:22px;font-weight:700;letter-spacing:-.02em}
.ibtn{width:38px;height:38px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;flex:none}
.ibtn:active{background:var(--fill2)}
.ibtn svg{width:20px;height:20px}
/* 分组 */
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin:22px 6px 8px}
.lbl:first-child{margin-top:4px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;width:100%;min-height:64px;padding:12px 14px 12px 16px;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:68px;height:1px;background:var(--line)}
button.row:active,.row.tap:active{background:var(--fill)}
.ic{width:40px;height:40px;border-radius:12px;background:var(--fill);display:flex;align-items:center;justify-content:center;flex:none;color:var(--text)}
.ic svg{width:22px;height:22px}
.ic.lan{position:relative}
.ic.lan::after{content:"";position:absolute;right:-2px;top:-2px;width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--card)}
.tx{flex:1;min-width:0;margin-left:12px}
.tx b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx>span{display:block;font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:8px;height:14px;color:var(--muted);opacity:.6;flex:none;margin-left:8px}
.more{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none;margin:-4px -6px -4px 6px}
.more:active{background:var(--fill)}
.more svg{width:20px;height:20px}
.mini .row{min-height:52px}
.mini .ic{width:32px;height:32px;border-radius:9px}.mini .ic svg{width:19px;height:19px}
.mini .row+.row::before{left:60px}
.mini .tx b{font-size:15.5px;font-weight:500}
/* 按钮 */
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:50px;border-radius:14px;background:var(--fill);color:var(--text);font-size:16px;font-weight:600}
.btn:active{opacity:.85;transform:scale(.985)}
.btn.pri{background:var(--pri);color:var(--prit)}
.btn.red{color:var(--danger)}
.btn svg{width:20px;height:20px;margin-right:8px}
.btn:disabled{opacity:.45}
.sbtn{height:34px;padding:0 16px;border-radius:99px;background:var(--pri);color:var(--prit);font-size:14px;font-weight:600;flex:none;margin-left:8px}
.sbtn.soft{background:var(--fill);color:var(--text)}
/* 没有路由器时 */
.hero{text-align:center;padding:48px 0 18px}
.hero .logo{width:72px;height:72px;border-radius:18px;margin:0 auto 16px;box-shadow:0 10px 30px -8px rgba(16,28,64,.45)}
.hero h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.03em}
.hero p{margin:6px 0 0;font-size:15px;color:var(--muted)}
/* 输入 */
.inp{display:block;width:100%;height:48px;padding:0 14px;border-radius:12px;border:0;background:var(--fill);color:var(--text);font:inherit;font-size:15px;outline:none;-webkit-user-select:text;user-select:text}
.inp:focus{box-shadow:0 0 0 2px var(--brand)}
.err{color:var(--danger);font-size:13px;margin:8px 2px 0;line-height:1.5}
.err:empty{display:none}
/* 底部弹出的面板 */
.scrim{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;background:rgba(0,0,0,.36);opacity:0;transition:opacity .22s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px 20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.25,1);max-height:86vh;overflow:auto}
.sheet.on{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:0 auto 12px}
.sheet h3{margin:0 4px 14px;font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .btn{margin-top:10px}
.two{display:flex;margin-top:14px}.two .btn{margin-top:0}.two .btn+.btn{margin-left:10px}
/* 居中的小卡片：更新、确认 */
.dlg{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.42)}
.dlg .box{width:100%;max-width:380px;max-height:70vh;display:flex;flex-direction:column;background:var(--card);border-radius:22px;padding:22px 18px 16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg h3{margin:0;font-size:19px;font-weight:700;text-align:center}
.dlg .v{color:var(--muted);font-size:13.5px;text-align:center;margin-top:4px}
.dlg .notes{margin:14px 0 4px;font-size:14px;line-height:1.65;white-space:pre-line;overflow:auto;min-height:0;flex:1 1 auto;color:var(--text)}
.dlg .must{margin:10px 0 0;font-size:13.5px;color:var(--danger);font-weight:600;text-align:center}
.dlg p.msg{margin:8px 0 0;font-size:14.5px;color:var(--muted);text-align:center;line-height:1.55}
.dlg .btn{margin-top:12px;flex:none}
.dlg .two .btn{flex:1 1 0;min-width:0;margin-top:0} /* 两个按钮并排：各占一半（以前 flex:none 加 width:100% 第二个挤出卡片） */
/* 有新版本（「以后再说」以后） */
.upd{display:flex;align-items:center;padding:12px 12px 12px 16px;margin-bottom:18px}
.upd .tx b{font-size:15px}
/* 提示 */
.toast{position:fixed;left:50%;bottom:28px;z-index:60;max-width:calc(100% - 40px);transform:translate(-50%,20px);opacity:0;transition:opacity .2s,transform .2s;background:var(--pri);color:var(--prit);padding:11px 18px;border-radius:14px;font-size:14px;line-height:1.5;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;font-size:13px;color:var(--muted);margin-top:28px}
.foot button{color:var(--brand);font-weight:600;font-size:13px;margin-left:4px}
</style></head><body><div class="wrap">
<div class="head" id="head"><svg class="logo" aria-hidden="true" viewBox="0 0 100 100"><rect width="100" height="100" fill="#101C40"/><path d="M41.91 24.45A29 29 0 1 0 75.55 58.09A24 24 0 0 1 41.91 24.45Z" fill="#F4F1EA"/><path d="M62.6 21.4A17 17 0 0 1 78.6 37.4" stroke="#FFB547" stroke-width="4" stroke-linecap="round" fill="none"/><circle cx="63" cy="37" r="7" fill="#FFB547"/></svg><b>路由器面板</b><button class="ibtn hidden" id="addTop" aria-label="添加路由器"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>

<div class="card upd hidden" id="upd"><div class="tx" style="margin-left:0"><b>新版本 <span id="updV"></span></b></div><button class="sbtn" id="updBtn">更新</button></div>

<div id="main"></div>

<div class="foot">版本 <span id="ver"></span><button id="chk">检查更新</button></div>
</div>

<div class="scrim hidden" id="scrim"></div>
<div class="sheet hidden" id="sheet" role="dialog" aria-modal="true"></div>
<div class="dlg hidden" id="dlg" role="dialog" aria-modal="true"><div class="box" id="dlgBox"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const A = window.App || { version: () => 'dev', hub: () => '', routers: () => '[]', saveRouters() {}, open: (u) => (location.href = u), external: (u) => window.open(u), scan() {}, pickQr() {}, clipboard: () => '', update() {} };
const HUB = (A.hub() || '').replace(/\/$/, '');
$('ver').textContent = A.version();
// 线条图标（24 格，跟面板一个画法）
const I = {
	swap: '<path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>',
	router: '<rect x="3.5" y="12.5" width="17" height="7" rx="2"/><path d="M7.5 16h.01M10.5 16h.01M14 16h3"/><path d="M8.5 9.2a5 5 0 0 1 7 0M6 6.6a8.6 8.6 0 0 1 12 0"/>',
	user: '<circle cx="12" cy="8.5" r="3.8"/><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/>',
	scan: '<path d="M4 8.5V6a2 2 0 0 1 2-2h2.5M15.5 4H18a2 2 0 0 1 2 2v2.5M20 15.5V18a2 2 0 0 1-2 2h-2.5M8.5 20H6a2 2 0 0 1-2-2v-2.5M4 12h16"/>',
	img: '<rect x="4" y="5" width="16" height="14" rx="2.5"/><circle cx="9.2" cy="10" r="1.6"/><path d="M5 17.5l4.6-4.6 3.4 3.4 2.4-2.4 3.6 3.6"/>',
	paste: '<rect x="6" y="4.5" width="12" height="16" rx="2.5"/><path d="M9.5 4.5V4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v.5M9.5 10h5M9.5 13.5h5M9.5 17h3"/>',
	key: '<path d="M5 7.5h14v9H5z" stroke-linejoin="round"/><path d="M8 12h.01M11 12h.01M14 12h.01M8 14.8h8"/>',
	plus: '<path d="M12 5v14M5 12h14"/>',
	dots: '<circle cx="5.5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.3" fill="currentColor" stroke="none"/>',
	open: '<path d="M14 5h5v5M19 5l-8 8M18 14v3.5a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 5 17.5v-10A1.5 1.5 0 0 1 6.5 6H10"/>',
	pen: '<path d="M14.5 5.5l4 4L9 19H5v-4z" stroke-linejoin="round"/>',
	trash: '<path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/>',
};
const ic = (k, sw) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw || 1.8}" stroke-linecap="round">${I[k]}</svg>`;
const CHEV = '<svg class="chev" viewBox="0 0 8 14" aria-hidden="true"><path d="M1.5 1.5 6.5 7l-5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let tt = 0;
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('on'), 2600); }

// 认出扫到或粘贴的内容：登录地址 / 面板 + #login / 官网配对链接
function parse(t) {
	t = String(t || '').trim();
	let m = /^https:\/\/([a-z0-9.-]+(?::\d+)?)\/cgi-bin\/mcp\/([A-Za-z0-9]{16,64})\/?$/i.exec(t);
	if (m) return 'https://' + m[1] + '/panel/#login=' + m[2];
	m = /^https:\/\/([a-z0-9.-]+(?::\d+)?)\/panel\/(?:index\.html)?(#login=[A-Za-z0-9]{16,64})?$/i.exec(t);
	if (m) return 'https://' + m[1] + '/panel/' + (m[2] || '');
	if (HUB && t.startsWith(HUB + '/app?pair=') && /^[^\s]+\/app\?pair=[A-Za-z2-9]{6,12}$/.test(t)) return t;
	// 5.2 托管版：面板「在新手机上打开」的二维码是官网账号页；家人的加入链接
	if (HUB && (t === HUB + '/app' || t === HUB + '/app/' || /^[^\s]+\/app\?join=[A-Za-z2-9]{6,12}$/.test(t)) && t.startsWith(HUB + '/app')) return t;
	return null;
}
function onScan(t) { const u = parse(t); if (u) { closeSheet(); A.open(u); } else toast('不是路由器面板的二维码'); }

/* ---------- 底部面板（添加、单台路由器的操作）和居中小卡片（更新、确认） ---------- */
let sheetOn = false;
function openSheet(html, bind) {
	const s = $('sheet'), c = $('scrim');
	s.innerHTML = '<div class="grab"></div>' + html;
	s.classList.remove('hidden'); c.classList.remove('hidden');
	void s.offsetWidth; s.classList.add('on'); c.classList.add('on');
	sheetOn = true;
	if (bind) bind(s);
}
function closeSheet() {
	if (!sheetOn) return; sheetOn = false;
	const s = $('sheet'), c = $('scrim');
	s.classList.remove('on'); c.classList.remove('on');
	setTimeout(() => { if (!sheetOn) { s.classList.add('hidden'); c.classList.add('hidden'); s.innerHTML = ''; } }, 260);
}
$('scrim').onclick = closeSheet;
let dlgLock = false;
function openDlg(html, bind, lock) { $('dlgBox').innerHTML = html; $('dlg').classList.remove('hidden'); dlgLock = !!lock; if (bind) bind($('dlgBox')); }
function closeDlg() { $('dlg').classList.add('hidden'); $('dlgBox').innerHTML = ''; dlgLock = false; }
$('dlg').onclick = (e) => { if (e.target === $('dlg') && !dlgLock) closeDlg(); };

/* ---------- 添加路由器 ---------- */
const BADADDR = '不是登录地址。登录地址像这样：https://…/cgi-bin/mcp/…';
function tryAdd(t, errEl) {
	const u = parse(t);
	if (errEl) errEl.textContent = u || !t ? '' : BADADDR;
	if (u) { closeSheet(); A.open(u); }
	return !!u;
}
async function readClip() {
	let t = '';
	try { t = (A.clipboard && A.clipboard()) || ''; } catch (e) {}
	if (!t) { try { t = await Promise.race([navigator.clipboard.readText(), new Promise((r) => setTimeout(() => r(''), 1500))]); } catch (e) {} }
	return String(t || '').trim();
}
// 粘贴：用手机系统的剪贴板；不是登录地址就打开「输入登录地址」放进框里给你看
async function doPaste() {
	const t = await readClip();
	if (!t) return toast('剪贴板是空的');
	if (!tryAdd(t)) typeAddr(t.slice(0, 300), BADADDR);
}
function typeAddr(val, err) {
	openSheet(`<h3>输入登录地址</h3><form id="addForm" autocomplete="off" novalidate><input class="inp" id="addr" type="text" inputmode="url" placeholder="https://…/cgi-bin/mcp/…" autocapitalize="off" spellcheck="false"><div class="err" id="aerr"></div><button class="btn pri" id="addBtn">添加</button></form>`, (s) => {
		const inp = s.querySelector('#addr'), er = s.querySelector('#aerr');
		inp.value = val || ''; er.textContent = err || '';
		inp.oninput = () => { er.textContent = ''; backWarned = false; };
		s.querySelector('#addForm').onsubmit = (e) => { e.preventDefault(); const t = inp.value.trim(); if (!t) { er.textContent = '先粘贴或输入登录地址'; inp.focus(); return; } tryAdd(t, er); };
		if (!val) setTimeout(() => inp.focus(), 320);
	});
}
const ADD_ROWS = () => (HUB ? `<button class="row" data-a="hub"><span class="ic">${ic('user')}</span><span class="tx"><b>登录官网账号</b></span>${CHEV}</button>` : '')
	+ `<button class="row" data-a="scan"><span class="ic">${ic('scan')}</span><span class="tx"><b>扫码</b></span>${CHEV}</button>`
	+ `<button class="row" data-a="album"><span class="ic">${ic('img')}</span><span class="tx"><b>从相册识别二维码</b></span>${CHEV}</button>`
	+ `<button class="row" data-a="paste"><span class="ic">${ic('paste')}</span><span class="tx"><b>粘贴登录地址</b></span>${CHEV}</button>`
	+ `<button class="row" data-a="type"><span class="ic">${ic('key')}</span><span class="tx"><b>输入登录地址</b></span>${CHEV}</button>`;
const ACTS = { hub: () => { closeSheet(); A.open(HUB + '/app'); }, scan: () => A.scan(), album: () => A.pickQr(), paste: doPaste, type: () => typeAddr('') };
function bindActs(el) { el.querySelectorAll('[data-a]').forEach((b) => (b.onclick = () => ACTS[b.dataset.a]())); }
function addSheet() { openSheet(`<h3>添加路由器</h3><div class="card mini">${ADD_ROWS()}</div>`, bindActs); }
$('addTop').onclick = addSheet;

/* ---------- 列表 ---------- */
const ago = (t) => { if (!t) return ''; const s = (Date.now() - t) / 1000; return s < 3600 ? '刚刚打开' : s < 86400 ? Math.round(s / 3600) + ' 小时前' : Math.round(s / 86400) + ' 天前'; };
const hostOf = (u) => u.replace(/^https?:\/\//, '').replace(/\/panel\/$/, '');
let list = [], found = [];
function load() { try { list = JSON.parse(A.routers()); } catch (e) { list = []; } list.sort((a, b) => (b.at || 0) - (a.at || 0)); }
function render() {
	const have = list.map((r) => r.url), fd = found.filter((x) => !have.includes(x.url));
	const lan = fd.length ? `<div class="lbl">在家里找到</div><div class="card">${fd.map((x, i) => `<div class="row"><span class="ic lan">${ic('router')}</span><span class="tx"><b>${esc(x.ip)}</b><span>家里 Wi-Fi</span></span><button class="sbtn" data-fo="${i}">打开</button></div>`).join('')}</div>` : '';
	let h;
	if (list.length) {
		h = `<div class="lbl">我的路由器</div><div class="card">${list.map((r, i) => {
			const host = hostOf(r.url), sub = (r.name !== host && host.split(':')[0] !== r.name ? host + ' · ' : '') + ago(r.at);  // 名字就是地址（没改过名）时不再写一遍
			return `<div class="row tap" data-i="${i}"><span class="ic">${ic('router')}</span><span class="tx"><b>${esc(r.name)}</b><span>${esc(sub)}</span></span><button class="more" data-m="${i}" aria-label="更多">${ic('dots')}</button></div>`;
		}).join('')}</div>${lan}<div class="lbl"></div><div class="card mini"><button class="row" data-a="add"><span class="ic">${ic('plus', 2)}</span><span class="tx"><b>添加路由器</b></span>${CHEV}</button>${HUB ? `<button class="row" data-a="hub"><span class="ic">${ic('user')}</span><span class="tx"><b>官网账号</b></span>${CHEV}</button>` : ''}</div>`;
	} else {
		h = `<div class="hero"><svg class="logo" aria-hidden="true" viewBox="0 0 100 100"><rect width="100" height="100" fill="#101C40"/><path d="M41.91 24.45A29 29 0 1 0 75.55 58.09A24 24 0 0 1 41.91 24.45Z" fill="#F4F1EA"/><path d="M62.6 21.4A17 17 0 0 1 78.6 37.4" stroke="#FFB547" stroke-width="4" stroke-linecap="round" fill="none"/><circle cx="63" cy="37" r="7" fill="#FFB547"/></svg><h1>路由器面板</h1><p>管理家里的 OpenWrt 路由器</p></div>${lan}`
			+ (HUB ? `<div class="lbl">${fd.length ? '托管版' : '托管版、家人加入'}</div><button class="btn pri" data-a="hub">${ic('user', 2)}登录官网账号</button>` : '')
			+ `<div class="lbl">自建版</div><div class="card mini">${ADD_ROWS().replace(/^<button class="row" data-a="hub">[\s\S]*?<\/button>/, '')}</div>`;
	}
	$('main').innerHTML = h;
	$('addTop').classList.toggle('hidden', !list.length);
	$('head').classList.toggle('hidden', !list.length);  // 没有路由器时顶上就是大图标，不再重复一个小的
	$('main').querySelectorAll('[data-i]').forEach((el) => { el.onclick = (e) => { if (e.target.closest('[data-m]')) return; A.open(list[+el.dataset.i].url); }; });
	$('main').querySelectorAll('[data-m]').forEach((b) => (b.onclick = () => routerSheet(+b.dataset.m)));
	$('main').querySelectorAll('[data-fo]').forEach((b) => (b.onclick = () => A.open(fd[+b.dataset.fo].url)));
	$('main').querySelectorAll('[data-a]').forEach((b) => (b.onclick = () => (b.dataset.a === 'add' ? addSheet() : ACTS[b.dataset.a]())));
}
// 单台路由器：打开 / 改名 / 移除
// 托管版换版本（AI 版 / 本地版）在官网账号页做：家里的地址（本地版）带 ed=local，托管网址带它的编号（用户 11/28 17:32）
const HUBH = (() => { try { return new URL(HUB).host; } catch (e) { return ''; } })();
function edOf(url) {
	if (!HUB) return '';
	const m = /^(https?):\/\/([^/:]+)(:\d+)?\//.exec(url || ''); if (!m) return '';
	if (m[1] === 'http' && /^(10|192\.168|172\.(1[6-9]|2\d|3[01]))\./.test(m[2])) return 'local';
	const sm = HUBH && m[1] === 'https' && m[2].endsWith('.' + HUBH) ? /^([a-z2-9]{8})\./.exec(m[2]) : null;
	return sm ? sm[1] : '';
}
const edGo = (e) => { closeSheet(); closeDlg(); A.open(HUB + '/app?ed=' + e); };
// 打开家里的地址失败（App 调）：多半是人在外面
window.lanFail = (url) => {
	const r = list.find((x) => x.url === url), n = r ? r.name : hostOf(url);
	openDlg(`<h3>打不开「${esc(n)}」</h3><p class="msg">这是家里的地址，要连着家里 Wi-Fi 才能打开。${HUB ? '<br>托管版想在外面用：换成 AI 版。' : ''}</p><div class="two">${HUB ? '<button class="btn" data-n>知道了</button><button class="btn pri" data-y>换成 AI 版</button>' : '<button class="btn pri" data-n>知道了</button>'}</div>`, (b) => {
		b.querySelector('[data-n]').onclick = closeDlg;
		const y = b.querySelector('[data-y]'); if (y) y.onclick = () => edGo('local');
	});
};
function routerSheet(i) {
	const r = list[i]; if (!r) return;
	const ed = edOf(r.url);
	openSheet(`<h3>${esc(r.name)}</h3><div class="card mini"><button class="row" data-x="open"><span class="ic">${ic('open')}</span><span class="tx"><b>打开</b></span></button>${ed ? `<button class="row" data-x="ed"><span class="ic">${ic('swap')}</span><span class="tx"><b>换版本</b></span></button>` : ''}<button class="row" data-x="ren"><span class="ic">${ic('pen')}</span><span class="tx"><b>改名</b></span></button><button class="row" data-x="del"><span class="ic" style="color:var(--danger)">${ic('trash')}</span><span class="tx"><b style="color:var(--danger)">移除</b></span></button></div>`, (s) => {
		s.querySelector('[data-x=open]').onclick = () => { closeSheet(); A.open(r.url); };
		if (ed) s.querySelector('[data-x=ed]').onclick = () => edGo(ed);
		s.querySelector('[data-x=ren]').onclick = () => renSheet(i);
		s.querySelector('[data-x=del]').onclick = () => { closeSheet(); delDlg(i); };
	});
}
function renSheet(i) {
	const r = list[i];
	openSheet(`<h3>改名</h3><form id="renForm" autocomplete="off" novalidate><input class="inp" id="renIn" maxlength="30" placeholder="比如：家里、公司"><button class="btn pri">保存</button></form>`, (s) => {
		const inp = s.querySelector('#renIn'); inp.value = r.name; setTimeout(() => { inp.focus(); inp.select(); }, 320);
		s.querySelector('#renForm').onsubmit = (e) => { e.preventDefault(); const n = inp.value.trim(); if (!n) return inp.focus(); r.name = n.slice(0, 30); A.saveRouters(JSON.stringify(list)); closeSheet(); render(); };
	});
}
function delDlg(i) {
	const r = list[i];
	openDlg(`<h3>移除「${esc(r.name)}」</h3><p class="msg">路由器本身不受影响，以后可以重新添加。</p><div class="two"><button class="btn" data-n>取消</button><button class="btn red" data-y>移除</button></div>`, (b) => {
		b.querySelector('[data-n]').onclick = closeDlg;
		b.querySelector('[data-y]').onclick = () => { list.splice(i, 1); A.saveRouters(JSON.stringify(list)); closeDlg(); render(); toast('已移除'); };
	});
}
function refresh() { findLan(); load(); render(); }
// 在家里 Wi-Fi 下找路由器面板（App 问网关的 906 端口）。只发现，不自动登录；已经在列表里的不重复列
let findAt = 0;
function findLan() { if (!A.discover || Date.now() - findAt < 30000) return; findAt = Date.now(); A.discover(); }
window.onFound = (l) => { found = (Array.isArray(l) ? l : []).filter((x) => x && /^http:\/\/[0-9.]+:\d+\/panel\/$/.test(x.url)); render(); };

// 返回键（App 调）：先关弹出的面板和卡片；必须更新的卡片关不掉（返回 false 退出）；输入框里有没添加的地址先提醒一次
let backWarned = false;
window.appBack = () => {
	if (!$('dlg').classList.contains('hidden')) { if (dlgLock) return false; closeDlg(); return true; }
	if (sheetOn) { const a = $('addr'); if (a && a.value.trim() && !backWarned) { backWarned = true; $('aerr').textContent = '地址还没添加。再按一次返回'; return true; } closeSheet(); return true; }
	return false;
};

/* ---------- 检查更新：问官网最新版本号，比现在的新就提示 ---------- */
const vnum = (v) => String(v || '').replace(/^v/, '').split('.').map((x) => parseInt(x, 10) || 0);
const newer = (a, b) => { const x = vnum(a), y = vnum(b); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; };
// 有新版本：一打开 App 就弹；「以后再说」当天这个版本不再弹（顶上的更新条还在）
// 必须更新（官网说 force，或者现在的版本低于「最低版本」）：卡片关不掉
let updJ = null;
function startUpdate(j) {
	const url = HUB + (j.apk || '/app/router-panel.apk');
	document.querySelectorAll('[data-upgo]').forEach((b) => { b.disabled = true; b.textContent = '正在下载…'; });
	A.update(url);
}
function showUpdate(j, force) {
	openDlg(`<h3>发现新版本</h3><div class="v">${esc(A.version())} → ${esc(j.version)}</div><div class="notes">${esc(j.notes || '')}</div>${force ? '<div class="must">这个版本必须更新，更新后才能继续使用。</div>' : ''}<button class="btn pri" data-upgo>立即更新</button>${force ? '' : '<button class="btn" data-later style="background:none;color:var(--muted);margin-top:2px">以后再说</button>'}`, (b) => {
		b.querySelector('[data-upgo]').onclick = () => startUpdate(j);
		const l = b.querySelector('[data-later]');
		if (l) l.onclick = () => { try { localStorage.setItem('upd_later', j.version + '@' + new Date().toDateString()); } catch (e) {} closeDlg(); };
	}, force);
}
async function checkUpdate(manual) {
	if (!HUB) { if (manual) toast('这个版本没有设置更新地址'); return; }
	try {
		const j = await (await fetch(HUB + '/api/app/version', { cache: 'no-store' })).json();
		if (j.version && newer(j.version, A.version())) {
			updJ = j;
			$('updV').textContent = j.version; $('upd').classList.remove('hidden');
			$('updBtn').setAttribute('data-upgo', ''); $('updBtn').onclick = () => startUpdate(j);
			const force = !!j.force || (!!j.min && newer(j.min, A.version()));
			let later = ''; try { later = localStorage.getItem('upd_later') || ''; } catch (e) {}
			if (manual || force || later !== j.version + '@' + new Date().toDateString()) showUpdate(j, force);
		} else if (manual) toast('已经是最新版');
	} catch (e) { if (manual) toast('检查更新失败，稍后再试'); }
}
function onUpdateFail() { document.querySelectorAll('[data-upgo]').forEach((b) => { b.disabled = false; b.textContent = b.id === 'updBtn' ? '更新' : '立即更新'; }); }
$('chk').onclick = () => checkUpdate(true);

load();
render();
findLan();
// 打开 App：只有一台路由器时直接进它的面板（用户 11/28 定）。App 带着网址打开（官网登录回来、调试）时不进；
// 先等检查更新最多 1.5 秒：必须更新的卡片出来了就不进（普通的新版本提示留在首页，返回时看得到）
const auto = list.length === 1 && (!A.plainLaunch || A.plainLaunch());
Promise.race([checkUpdate(false), new Promise((r) => setTimeout(r, 1500))]).then(() => { if (auto && !dlgLock) A.open(list[0].url); });
</script></body></html>
