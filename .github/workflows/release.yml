# 发布新版本：在 GitHub 网页的 Actions → 「发布新版本」→ Run workflow，填版本号（例如 v1.0.0）
# 会自动打安装包（四个自建版；设置了 HUB_URL 时再加两个托管版）和安卓 App，创建 Release 并上传
# App 的代码这次没改的话，app-version.json 里写的是 App 上次改动的版本，App 不会弹更新；改了才提示（必须更新）
name: 发布新版本
on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（例如 v1.0.0）
        required: true
        default: v1.0.0
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 要完整历史和标签：算 App 上次改动是哪个版本
      - name: 打包
        env:
          HUB_URL: ${{ vars.HUB_URL }}
        run: sh tools/pack.sh "${{ inputs.version }}"
      - name: App 版本（App 没改就不让 App 弹更新）
        run: |
          sh tools/app-version.sh "${{ inputs.version }}" > dist/app-version.json
          echo "::notice::App 版本：$(jq -r .version dist/app-version.json)（跟这次发布的版本一样 = App 改了，会提示用户必须更新；不一样 = App 没改，不弹更新）"
      - name: 创建 Release 并上传安装包
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" dist/*.tar.gz dist/SHA256SUMS dist/app-version.json \
            --target "$GITHUB_SHA" \
            --title "$VERSION：托管版 + 四个自建版 + 安卓 App" \
            --notes-file tools/release-notes.md
  android:
    needs: release
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ inputs.version }}
      release: true
    secrets: inherit
