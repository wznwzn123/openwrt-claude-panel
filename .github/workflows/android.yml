# 安卓 App 打包
# - 单独运行（Actions → 构建安卓 App → Run workflow）：打一个测试包，放在这次运行的「Artifacts」里下载
# - 发布新版本时会自动调用：打正式包（用签名密钥），传到这个版本的 Release 里，文件名 router-panel.apk
# 正式签名需要仓库密钥 ANDROID_SIGNING_PASS（解开 android/signing/router-panel.jks.enc 的密码）
name: 构建安卓 App
on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（例如 1.2.0）
        required: true
        default: 0.0.1
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release:
        required: false
        type: boolean
        default: false
    secrets:
      ANDROID_SIGNING_PASS:
        required: false
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: 版本号
        id: v
        run: |
          V="${{ inputs.version }}"; V="${V#v}"
          IFS=. read -r A B C <<< "$V"
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${A:-0} * 10000 + ${B:-0} * 100 + ${C:-0} ))" >> "$GITHUB_OUTPUT"
      - name: 解开签名密钥
        env:
          PASS: ${{ secrets.ANDROID_SIGNING_PASS }}
        run: |
          if [ -n "$PASS" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/signing/router-panel.jks.enc -out "$RUNNER_TEMP/release.jks" -pass env:PASS
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASS=$PASS" >> "$GITHUB_ENV"
            echo "::notice::使用正式签名"
          else
            if [ "${{ inputs.release }}" = "true" ]; then echo "::error::发布正式版需要先设置仓库密钥 ANDROID_SIGNING_PASS"; exit 1; fi
            echo "::warning::没有设置 ANDROID_SIGNING_PASS，打的是测试包（调试签名），不能拿去发布"
          fi
      - name: 打包
        env:
          HUB_URL: ${{ vars.HUB_URL }}
        run: |
          gradle -p android --no-daemon assembleRelease \
            -PVERSION_NAME="${{ steps.v.outputs.name }}" -PVERSION_CODE="${{ steps.v.outputs.code }}" -PHUB_URL="$HUB_URL"
          cp android/app/build/outputs/apk/release/app-release.apk router-panel.apk
          ls -la router-panel.apk
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: router-panel-${{ steps.v.outputs.name }}
          path: router-panel.apk
      - name: 传到 Release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.version }}" router-panel.apk --clobber
